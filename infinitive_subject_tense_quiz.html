<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To부정사의 의미상 주어와 시제 퀴즈</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Inter 폰트 사용 설정 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* 밝은 회색 배경 */
        }
        .quiz-container {
            max-width: 640px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        /* Custom style for the underline effect using border-bottom */
        .question-text-line {
            display: inline-block;
            border-bottom: 2px solid #3b82f6; /* Indigo color for underline */
            padding-bottom: 2px;
            line-height: 1.25;
            min-width: 150px; /* Minimum width for the blank */
            text-align: center;
        }

        /* 인쇄용 CSS 설정 */
        @media print {
            body {
                background-color: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .quiz-container {
                box-shadow: none !important;
                margin: 0 auto !important;
                padding: 0 !important;
                max-width: 100% !important;
            }
            /* 인쇄 시 숨길 요소 */
            #mode-toggle-btn, #progress-text, #question-area, #submit-btn, #next-btn, #feedback-message, #restart-btn, #new-quiz-btn, #print-btn, .flex.justify-between.items-center.gap-4 {
                display: none !important;
            }
            /* 결과 영역을 깨끗하게 표시 */
            #result-area {
                display: block !important;
                background-color: white !important;
                border: none !important;
                color: black !important;
                padding: 0 !important;
                margin-top: 0 !important;
            }
            #result-area p, #result-area h3 {
                color: black !important;
            }
            /* 틀린 문제 복습 부분의 배경색을 회색으로 (인쇄용) */
            #missed-questions-container .bg-gray-50 {
                background-color: #eeeeee !important;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
            #missed-questions-container .text-red-700, #missed-questions-container .text-green-700 {
                color: #333 !important;
            }
        }
    </style>
</head>
<body class="p-4">

    <div id="quiz-app" class="quiz-container">
        <h1 class="text-3xl font-extrabold text-center text-indigo-700 mb-6 border-b pb-3">To부정사의 의미상 주어/시제 퀴즈 (10문제)</h1>

        <!-- 모드 선택 및 진행 상황 표시 -->
        <div class="flex justify-between items-center mb-4">
             <button id="mode-toggle-btn" class="py-2 px-4 text-sm bg-gray-200 text-gray-800 font-semibold rounded-lg hover:bg-gray-300 transition duration-150">
                현재: 객관식 (변경: 주관식으로 보기)
            </button>
            <span id="progress-text" class="text-lg font-semibold text-gray-600">문제 1 / 10</span>
        </div>

        <!-- 문제 영역 -->
        <div id="question-area" class="bg-indigo-50 p-6 rounded-lg mb-6">
            <p class="text-sm text-indigo-600 mb-2">다음 문장을 읽고, 밑줄에 들어갈 **올바른 To부정사 구문**을 영문으로 완성하세요. (의미상 주어 또는 시제 포함)</p>
            <p id="active-sentence" class="text-xl font-bold text-gray-800 mb-4 break-words">Context Sentence</p>
            
            <!-- 질문 텍스트: 밑줄(_______) 대신 HTML <span> 태그를 사용하여 밑줄 시각화 -->
            <p id="question-text" class="text-lg text-gray-700 mb-4 break-words">Question: It is important (_______) a dictionary when learning a new language.</p>
            
            <!-- 주관식 입력 필드 (객관식이 디폴트이므로 기본 숨김) -->
            <input type="text" id="user-answer" placeholder="여기에 정답을 입력하세요 (예: for me to go, to have been)" 
                   class="w-full p-3 border-2 border-indigo-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-150 ease-in-out hidden">

            <!-- 객관식 옵션 영역 -->
            <div id="multiple-choice-area" class="mt-4 flex flex-col space-y-3">
                <!-- Radio buttons will be inserted here by JavaScript -->
            </div>
        </div>

        <!-- 피드백 및 버튼 영역 -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
            <div id="feedback-message" class="text-lg font-medium w-full sm:w-2/3 min-h-[1.5rem]"></div>
            
            <button id="submit-btn" 
                    class="w-full sm:w-1/3 py-3 px-6 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 transition duration-300 ease-in-out">
                정답 확인
            </button>
            <button id="next-btn" 
                    class="w-full sm:w-1/3 py-3 px-6 bg-green-500 text-white font-semibold rounded-lg shadow-md hover:bg-green-600 transition duration-300 ease-in-out hidden" disabled>
                다음 문제
            </button>
            <!-- 퀴즈 진행 중에는 숨기고, 결과 화면에서 표시 -->
            <button id="restart-btn" 
                    class="w-full sm:w-1/3 py-3 px-6 bg-gray-500 text-white font-semibold rounded-lg shadow-md hover:bg-gray-600 transition duration-300 ease-in-out hidden">
                다시 풀기
            </button>
        </div>

        <!-- 최종 점수 영역 (디자인 변경됨) -->
        <div id="result-area" class="mt-8 p-6 bg-white border-2 border-indigo-300 rounded-xl shadow-lg hidden">
            <p class="text-xl font-bold mb-2 text-indigo-700 border-b pb-2">퀴즈 결과</p>
            <p id="final-score" class="text-4xl font-extrabold text-indigo-800 my-4 text-center"></p>
            <!-- 틀린 문제 목록 표시 영역 -->
            <div id="missed-questions-container"></div>
            <!-- 버튼 그룹 -->
            <div class="flex flex-col sm:flex-row gap-4 mt-6">
                <button id="new-quiz-btn" class="w-full py-3 px-4 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 transition duration-300 ease-in-out hidden">
                    문제 더 풀기 (랜덤)
                </button>
                <!-- 인쇄 버튼 -->
                <button id="print-btn" class="w-full py-3 px-4 bg-gray-600 text-white font-semibold rounded-lg shadow-md hover:bg-gray-700 transition duration-300 ease-in-out hidden">
                    결과 인쇄하기
                </button>
            </div>
            
        </div>
    </div>

    <script>
        // 문제 데이터: 총 20개 문제 풀 (To부정사의 의미상 주어와 시제)
        const masterQuizData = [
            // --- 의미상 주어 (for/of) 문제 ---
            {
                active: "The action of saving money requires effort from him.",
                question: "It is essential (_______) save money for his future.",
                answer: "for him to",
                explanation: "일반적인 상황이나 행위의 의미상 주어를 나타낼 때는 'for + 목적격'을 사용합니다.",
                options: ["for him to", "of him to", "to him to", "him to"]
            },
            {
                active: "She was very kind when she helped the old man.",
                question: "It was kind (_______) help the old man.",
                answer: "of her to",
                explanation: "사람의 성격이나 태도를 나타내는 형용사(kind) 뒤에는 'of + 목적격'을 사용합니다.",
                options: ["for her to", "of her to", "to her to", "her to"]
            },
            {
                active: "It takes patience for us to learn a new language.",
                question: "It requires patience (_______) learn a new language.",
                answer: "for us to",
                explanation: "일반적인 상황이므로 'for + 목적격'을 사용합니다.",
                options: ["for us to", "of us to", "us to", "to us to"]
            },
            {
                active: "He was foolish to leave his wallet on the table.",
                question: "It was foolish (_______) leave his wallet on the table.",
                answer: "of him to",
                explanation: "사람의 어리석은 성격(foolish)을 나타내므로 'of + 목적격'을 사용합니다.",
                options: ["for him to", "of him to", "to him to", "him to"]
            },
            {
                active: "It is difficult for me to understand quantum physics.",
                question: "It is difficult (_______) understand quantum physics.",
                answer: "for me to",
                explanation: "상황의 난이도(difficult)를 나타내므로 'for + 목적격'을 사용합니다.",
                options: ["for me to", "of me to", "me to", "to me to"]
            },
            {
                active: "You were careless to forget your key.",
                question: "It was careless (_______) forget your key.",
                answer: "of you to",
                explanation: "사람의 부주의한 성격(careless)을 나타내므로 'of + 목적격'을 사용합니다.",
                options: ["for you to", "of you to", "you to", "to you to"]
            },
            {
                active: "They need to arrive early to catch the train.",
                question: "It is necessary (_______) arrive early to catch the train.",
                answer: "for them to",
                explanation: "일반적인 필요성(necessary)을 나타내므로 'for + 목적격'을 사용합니다.",
                options: ["for them to", "of them to", "them to", "to them to"]
            },
            {
                active: "She was polite to apologize immediately.",
                question: "It was polite (_______) apologize immediately.",
                answer: "of her to",
                explanation: "사람의 예의 바른 성격(polite)을 나타내므로 'of + 목적격'을 사용합니다.",
                options: ["for her to", "of her to", "her to", "to her to"]
            },

            // --- 시제 (단순/완료) 문제 - 원문 수정됨 ---
            {
                active: "It seems that he is sick now.",
                question: "He seems (_______) sick.",
                answer: "to be",
                explanation: "주절의 시제(seems, 현재)와 to부정사절의 시제(is, 현재)가 같으므로 단순 to부정사 'to be'를 사용합니다.",
                options: ["to be", "to have been", "to be being", "being"]
            },
            {
                active: "It seems that he failed the test yesterday.",
                question: "He seems (_______) the test yesterday.",
                answer: "to have failed",
                explanation: "주절 시제(seems, 현재)보다 to부정사절의 시제(failed, 과거)가 앞서므로 완료 to부정사 'to have failed'를 사용합니다.",
                options: ["to fail", "to be failed", "to have failed", "failing"]
            },
            {
                active: "She was standing right next to the ringing bell, but she didn't react.",
                question: "She pretended (_______) the bell.",
                answer: "not to hear",
                explanation: "주절 시제(pretended, 과거)와 to부정사절의 시제(didn't hear, 과거)가 같으므로 단순 to부정사의 부정형 'not to hear'를 사용합니다.",
                options: ["not to hear", "to not hear", "to have not heard", "to not have heard"]
            },
            {
                active: "People say that she is very wealthy.",
                question: "She is said (_______) very wealthy.",
                answer: "to be",
                explanation: "주절 시제(is said, 현재)와 to부정사절의 시제(is, 현재)가 같으므로 단순 to부정사 'to be'를 사용합니다.",
                options: ["to be", "to have been", "to be being", "being"]
            },
            {
                active: "People say that he invented the machine last year.",
                question: "He is said (_______) the machine last year.",
                answer: "to have invented",
                explanation: "주절 시제(is said, 현재)보다 to부정사절의 시제(invented, 과거)가 앞서므로 완료 to부정사 'to have invented'를 사용합니다.",
                options: ["to invent", "to be invented", "to have invented", "inventing"]
            },
            {
                active: "Since he worked all night, he must be tired now.",
                question: "He must be tired (_______) all night.",
                answer: "to have worked",
                explanation: "피곤한 것은 현재(must be)지만, 일한 것은 그 이전(과거)이므로 to부정사 부사적 용법의 완료형 'to have worked'를 사용합니다. ('~했었기 때문에')",
                options: ["to work", "to be working", "to have worked", "working"]
            },
            {
                active: "They won the match yesterday. They are happy about it now.",
                question: "They are happy (_______) the match.",
                answer: "to have won",
                explanation: "기쁜 것은 현재(are happy)지만, 이긴 것은 과거이므로 완료 to부정사 'to have won'을 사용합니다.",
                options: ["to win", "to be winning", "to have won", "winning"]
            },
            {
                active: "The car crash happened last year. She feels lucky today.",
                question: "She feels lucky (_______) the crash.",
                answer: "to have survived",
                explanation: "운이 좋은 것은 현재(feels lucky)지만, 사고에서 살아남은 것은 과거이므로 완료 to부정사 'to have survived'를 사용합니다.",
                options: ["to survive", "to be surviving", "to have survived", "surviving"]
            },
            {
                active: "It was generous of him to offer his help.",
                question: "It was generous (_______) his help.",
                answer: "of him to offer",
                explanation: "사람의 관대한 성격(generous)을 나타내므로 'of + 목적격 + to R'를 사용합니다.",
                options: ["for him to offer", "of him to offer", "him to offer", "to offer"]
            },
            {
                active: "We must understand the rules.",
                question: "It is necessary (_______) the rules.",
                answer: "for us to understand",
                explanation: "일반적인 필요성(necessary)을 나타내므로 'for + 목적격 + to R'를 사용합니다.",
                options: ["of us to understand", "for us to understand", "to understand", "us to understand"]
            },
            {
                active: "It appears that we are waiting for the bus now.",
                question: "We appear (_______) for the bus.",
                answer: "to be waiting",
                explanation: "주절 시제(appear, 현재)와 to부정사절의 시제(is waiting, 현재진행)가 동시에 진행 중임을 나타내므로 단순 진행 to부정사 'to be waiting'을 사용합니다.",
                options: ["to wait", "to be waiting", "to have waited", "to waiting"]
            },
            {
                active: "It is believed that he was a spy during the war.",
                question: "He is believed (_______) a spy during the war.",
                answer: "to have been",
                explanation: "주절 시제(is believed, 현재)보다 to부정사절의 시제(was, 과거)가 앞서므로 완료 to부정사 'to have been'을 사용합니다.",
                options: ["to be", "to have been", "being", "to be being"]
            },
        ];
        
        // 문제 개수를 20개로 맞추기 위해 마지막 8개 문제를 복사/변형하여 4개로 대체하고, 20개로 유지합니다.
        // 위의 masterQuizData는 이미 20개이므로 그대로 사용합니다.

        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswerChecked = false;
        let quizMode = 'objective'; 
        let incorrectAnswers = []; 
        let currentQuizSet = []; 

        // DOM 요소들 가져오기
        const progressText = document.getElementById('progress-text');
        const activeSentenceEl = document.getElementById('active-sentence');
        const questionTextEl = document.getElementById('question-text');
        const userAnswerEl = document.getElementById('user-answer');
        const feedbackMessageEl = document.getElementById('feedback-message');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const newQuizBtn = document.getElementById('new-quiz-btn'); 
        const resultArea = document.getElementById('result-area');
        const finalScoreEl = document.getElementById('final-score');
        const questionArea = document.getElementById('question-area');
        const modeToggleBtn = document.getElementById('mode-toggle-btn');
        const multipleChoiceArea = document.getElementById('multiple-choice-area');
        const blankUnderlineEl = document.getElementById('blank-underline');
        const missedQuestionsContainer = document.getElementById('missed-questions-container'); 
        const printBtn = document.getElementById('print-btn'); 

        // 배열 섞기 함수 (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 마스터 데이터에서 무작위로 문제를 선택하는 함수
        function selectRandomQuestions(data, count) {
            const shuffled = shuffleArray([...data]);
            return shuffled.slice(0, count);
        }

        // 퀴즈 모드 전환 함수
        function toggleQuizMode() {
            if (isAnswerChecked) return; 

            if (quizMode === 'subjective') {
                quizMode = 'objective';
                modeToggleBtn.textContent = '현재: 객관식 (변경: 주관식으로 보기)';
                userAnswerEl.classList.add('hidden');
                multipleChoiceArea.classList.remove('hidden');
                userAnswerEl.value = ''; 
            } else {
                quizMode = 'subjective';
                modeToggleBtn.textContent = '현재: 주관식 (변경: 객관식으로 보기)';
                userAnswerEl.classList.remove('hidden');
                multipleChoiceArea.classList.add('hidden');
                multipleChoiceArea.innerHTML = ''; 
            }
            submitBtn.textContent = '정답 확인';
            loadQuestion(true); 
            userAnswerEl.focus();
        }

        // 새로운 퀴즈 시작 또는 기존 퀴즈 다시 시작
        function startNewQuiz(isNewSet = false) {
            currentQuestionIndex = 0;
            score = 0;
            isAnswerChecked = false;
            incorrectAnswers = []; 

            // '문제 더 풀기'인 경우에만 문제 세트를 새로 선택
            if (isNewSet || currentQuizSet.length === 0) {
                 currentQuizSet = selectRandomQuestions(masterQuizData, 10);
            }

            // UI 요소 재설정
            questionArea.classList.remove('hidden');
            feedbackMessageEl.classList.remove('hidden', 'text-red-600', 'text-green-600');
            feedbackMessageEl.textContent = '';
            progressText.classList.remove('hidden');
            modeToggleBtn.classList.remove('hidden');
            restartBtn.classList.add('hidden');
            newQuizBtn.classList.add('hidden');
            printBtn.classList.add('hidden'); 
            resultArea.classList.add('hidden');
            
            loadQuestion();
        }

        // 퀴즈 시작 및 다음 문제 로드
        function loadQuestion(isModeChange = false) {
            if (currentQuestionIndex >= currentQuizSet.length) {
                showResults();
                return;
            }

            const currentQuestion = currentQuizSet[currentQuestionIndex];
            
            // 상태 초기화
            userAnswerEl.value = '';
            feedbackMessageEl.textContent = '';
            userAnswerEl.disabled = false;
            submitBtn.classList.remove('hidden');
            nextBtn.classList.add('hidden');
            nextBtn.disabled = true;
            isAnswerChecked = false;
            
            // 문제 내용 업데이트
            progressText.textContent = `문제 ${currentQuestionIndex + 1} / ${currentQuizSet.length}`;
            activeSentenceEl.textContent = currentQuestion.active;

            // 밑줄 시각화 처리
            const [prefix, suffix] = currentQuestion.question.split('(_______)');
            questionTextEl.innerHTML = `${prefix}<span class="question-text-line" id="blank-underline"></span>${suffix}`;
            
            // 모드에 따른 입력 UI 설정
            if (quizMode === 'subjective') {
                userAnswerEl.classList.remove('hidden');
                multipleChoiceArea.classList.add('hidden');
                userAnswerEl.focus();
            } else {
                userAnswerEl.classList.add('hidden');
                multipleChoiceArea.classList.remove('hidden');
                renderMultipleChoice(currentQuestion.options);
            }

            if (!isModeChange) {
                userAnswerEl.focus();
            }
        }

        // 객관식 옵션 렌더링
        function renderMultipleChoice(options) {
            multipleChoiceArea.innerHTML = '';
            const shuffledOptions = shuffleArray([...options]);

            shuffledOptions.forEach((option, index) => {
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.id = `option-${index}`;
                radio.name = 'quiz-option';
                radio.value = option;
                radio.className = 'w-5 h-5 text-indigo-600 focus:ring-indigo-500 border-gray-300';

                const label = document.createElement('label');
                label.htmlFor = `option-${index}`;
                label.textContent = option;
                label.className = 'ml-3 text-lg text-gray-700 cursor-pointer w-full p-2 rounded-lg border border-gray-200 hover:bg-indigo-100 transition duration-150 flex items-center';

                const div = document.createElement('div');
                div.className = 'flex items-center';
                div.appendChild(radio);
                div.appendChild(label);
                
                label.addEventListener('click', () => {
                    radio.checked = true;
                });

                multipleChoiceArea.appendChild(div);
            });
        }

        // 정답 확인 함수
        function checkAnswer() {
            if (isAnswerChecked) return;

            const currentQuestionData = currentQuizSet[currentQuestionIndex];
            let userAnswer;
            let isCorrect = false;

            if (quizMode === 'subjective') {
                userAnswer = userAnswerEl.value.trim().toLowerCase();
                if (userAnswer === '') {
                    feedbackMessageEl.className = 'text-lg font-medium w-full sm:w-2/3 text-red-600';
                    feedbackMessageEl.textContent = '답을 입력해 주세요.';
                    return;
                }
            } else { // objective mode
                const selectedRadio = document.querySelector('input[name="quiz-option"]:checked');
                if (!selectedRadio) {
                    feedbackMessageEl.className = 'text-lg font-medium w-full sm:w-2/3 text-red-600';
                    feedbackMessageEl.textContent = '답을 하나 선택해주세요.';
                    return;
                }
                userAnswer = selectedRadio.value.trim().toLowerCase();

                document.querySelectorAll('input[name="quiz-option"]').forEach(radio => radio.disabled = true);
            }

            const correctAnswer = currentQuestionData.answer.trim().toLowerCase();
            const explanation = currentQuestionData.explanation;
            
            userAnswerEl.disabled = true;
            submitBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            nextBtn.disabled = false;
            isAnswerChecked = true; 

            if (userAnswer === correctAnswer) {
                score++;
                isCorrect = true;
                feedbackMessageEl.className = 'text-lg font-medium w-full sm:w-2/3 text-green-600';
                feedbackMessageEl.textContent = '✅ 정답입니다! 다음 문제로 넘어가세요.';

                if (quizMode === 'subjective') {
                    userAnswerEl.classList.remove('border-red-500');
                    userAnswerEl.classList.add('border-green-500');
                } else {
                    document.querySelectorAll('input[name="quiz-option"]').forEach(radio => {
                        const label = radio.nextElementSibling;
                        if (radio.value.toLowerCase() === correctAnswer) {
                            label.classList.add('bg-green-200', 'border-green-500');
                        }
                    });
                }
            } else {
                // 오답인 경우, 틀린 문제 배열에 추가
                incorrectAnswers.push(currentQuestionData);

                feedbackMessageEl.className = 'text-lg font-medium w-full sm:w-2/3 text-red-600';
                feedbackMessageEl.innerHTML = `❌ 오답입니다. 정답: <span class="font-extrabold text-blue-600">'${currentQuestionData.answer}'</span><br><span class="text-sm text-gray-700">💡 해설: ${explanation}</span>`;
                
                if (quizMode === 'subjective') {
                    userAnswerEl.classList.remove('border-green-500');
                    userAnswerEl.classList.add('border-red-500');
                } else {
                    document.querySelectorAll('input[name="quiz-option"]').forEach(radio => {
                        const label = radio.nextElementSibling;
                        if (radio.checked) {
                            label.classList.add('bg-red-200', 'border-red-500'); 
                        } else if (radio.value.toLowerCase() === correctAnswer) {
                            label.classList.add('bg-blue-200', 'border-blue-500'); 
                        }
                    });
                }
            }
        }

        // 다음 문제로 이동
        function moveToNext() {
            if (!isAnswerChecked) {
                feedbackMessageEl.textContent = '먼저 정답을 확인하세요.';
                return;
            }
            
            userAnswerEl.classList.remove('border-green-500', 'border-red-500');
            userAnswerEl.classList.add('border-indigo-300');

            currentQuestionIndex++;
            loadQuestion();
        }

        // 결과 표시 함수
        function showResults() {
            questionArea.classList.add('hidden');
            submitBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            feedbackMessageEl.classList.add('hidden');
            progressText.classList.add('hidden');
            modeToggleBtn.classList.add('hidden');
            
            // 결과 화면 관련 버튼 표시
            restartBtn.classList.remove('hidden');
            newQuizBtn.classList.remove('hidden'); 
            printBtn.classList.remove('hidden'); 

            const total = currentQuizSet.length;
            finalScoreEl.textContent = `총 ${total}문제 중 ${score}점 획득하셨습니다! (${(score / total * 100).toFixed(0)}%)`;

            // 틀린 문제 목록 생성 및 표시
            missedQuestionsContainer.innerHTML = '';
            if (incorrectAnswers.length > 0) {
                let listHtml = '<h3 class="text-xl font-bold text-gray-800 mt-8 mb-4 border-t pt-4 border-indigo-200">틀린 문제 복습</h3>';
                
                incorrectAnswers.forEach((item, index) => {
                    // 밑줄을 시각화하고 정답 자리에는 정답 표시 (인디고 600)
                    const questionTextDisplay = item.question.replace('(_______)', `<span class="text-indigo-600 font-extrabold underline">${item.answer}</span>`);
                    
                    listHtml += `
                        <div class="p-4 mb-4 border border-gray-200 rounded-lg bg-gray-50">
                            <p class="font-bold text-base mb-1 text-gray-800">문제 ${index + 1}. (원문): ${item.active}</p>
                            <p class="mb-2 text-gray-600">질문: ${questionTextDisplay}</p>
                            <p class="text-green-700 font-semibold mt-2">✅ 정답: <span class="font-extrabold">${item.answer}</span></p>
                            <p class="text-sm text-gray-600 mt-2 border-t border-gray-300 pt-2">💡 해설: ${item.explanation}</p>
                        </div>
                    `;
                });
                missedQuestionsContainer.innerHTML = listHtml;
            } else {
                 missedQuestionsContainer.innerHTML = '<p class="text-lg text-green-700 mt-4 font-semibold text-center py-4">🎉 모든 문제를 맞추셨습니다! 대단해요!</p>';
            }

            resultArea.classList.remove('hidden');
        }

        // 퀴즈 재시작 함수 (동일 문제 세트로)
        function restartQuiz() {
            startNewQuiz(false);
        }
        
        // 신규 문제 풀기 함수 (새로운 문제 세트로)
        function startNewSetQuiz() {
            startNewQuiz(true);
        }

        // 인쇄 기능
        printBtn.addEventListener('click', () => {
            window.print();
        });

        // 이벤트 리스너 등록
        submitBtn.addEventListener('click', checkAnswer);
        nextBtn.addEventListener('click', moveToNext);
        restartBtn.addEventListener('click', restartQuiz); // '다시 풀기'
        newQuizBtn.addEventListener('click', startNewSetQuiz); // '문제 더 풀기 (랜덤)'
        modeToggleBtn.addEventListener('click', toggleQuizMode);
        
        // Enter 키 로직: '다음 문제' 버튼의 표시 여부와 현재 포커스에 따라 동작 분리
        document.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                
                // 3. 최종 결과 화면일 때 -> '다시 풀기'로 동작
                if (currentQuestionIndex >= currentQuizSet.length && resultArea.classList.contains('hidden') === false) {
                     restartBtn.click(); // '다시 풀기' 버튼 클릭 동작
                     return;
                }
                
                // 1. '다음 문제' 버튼이 숨겨져 있다면 (아직 정답 확인 전) -> 정답 확인
                if (nextBtn.classList.contains('hidden')) {
                    // 주관식: 입력 필드에 포커스가 있고 내용이 있을 때
                    if (quizMode === 'subjective' && document.activeElement === userAnswerEl && userAnswerEl.value.trim() !== '') {
                        checkAnswer();
                    } 
                    // 객관식: 옵션 중 하나가 선택되었을 때
                    else if (quizMode === 'objective' && document.querySelector('input[name="quiz-option"]:checked')) {
                        checkAnswer();
                    }
                } 
                // 2. '다음 문제' 버튼이 보인다면 (정답 확인 후) -> 다음 문제로 이동
                else {
                    moveToNext();  
                }
            }
        });

        // 퀴즈 초기 로드 (새로운 문제 세트로 시작)
        window.onload = () => startNewQuiz(true);
    </script>
</body>
</html>
