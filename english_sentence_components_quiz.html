<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영어 문장 성분 퀴즈</title>
    <!-- Tailwind CSS CDN --><script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Inter 폰트 사용 설정 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* 밝은 회색 배경 */
        }
        .quiz-container {
            max-width: 640px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        /* Custom style for the underline effect using border-bottom (밑줄 친 성분 강조) */
        .question-text-line {
            /* 문장 강조를 위해 주황색 밑줄과 굵은 글씨 유지 */
            display: inline-block;
            border-bottom: 3px solid #f97316; /* Deep Orange 500 color for underline */
            padding-bottom: 1px;
            line-height: 1.25;
            text-align: center;
            font-weight: bold;
            color: #c2410c; /* Deep Orange 700 for text */
        }

        /* 인쇄용 CSS 설정 */
        @media print {
            body {
                background-color: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .quiz-container {
                box-shadow: none !important;
                margin: 0 auto !important;
                padding: 0 !important;
                max-width: 100% !important;
            }
            /* 인쇄 시 숨길 요소 */
            #progress-text, #question-area, #submit-btn, #next-btn, #feedback-message, #restart-btn, #new-quiz-btn, #print-btn, .flex.justify-between.items-center.gap-4 {
                display: none !important;
            }
            /* 결과 영역을 깨끗하게 표시 */
            #result-area {
                display: block !important;
                background-color: white !important;
                border: none !important;
                color: black !important;
                padding: 0 !important;
                margin-top: 0 !important;
            }
            #result-area p, #result-area h3 {
                color: black !important;
            }
            /* 틀린 문제 복습 부분의 배경색을 회색으로 (인쇄용) */
            #missed-questions-container .bg-gray-50 {
                background-color: #eeeeee !important;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
            #missed-questions-container .text-red-700, #missed-questions-container .text-green-700 {
                color: #333 !important;
            }
        }
    </style>
</head>
<body class="p-4">

    <div id="quiz-app" class="quiz-container">
        <h1 class="text-3xl font-extrabold text-center text-sky-700 mb-6 border-b pb-3">영어 문장 성분 퀴즈 (10문제)</h1>

        <!-- 모드 선택 및 진행 상황 표시 --><div class="flex justify-end items-center mb-4">
            <span id="progress-text" class="text-lg font-semibold text-gray-600">문제 1 / 10</span>
        </div>

        <!-- 문제 영역 --><div id="question-area" class="bg-sky-50 p-6 rounded-lg mb-6">
            <p class="text-sm text-sky-600 mb-2">다음 문장을 읽고, 밑줄 친 부분이 문장의 **어떤 성분**에 해당하는지 선택하세요. (주어, 동사, 목적어, 보어, 부사어)</p>
            <!-- '지침: 밑줄 친 성분을 고르세요.' 문구 제거됨. -->
            <p id="active-sentence" class="text-base font-medium text-gray-800 mb-4 break-words"></p>
            
            <!-- 질문 텍스트: 폰트 크기 text-2xl -> text-xl 로 줄임 --><p id="question-text" class="text-xl text-gray-800 mb-4 break-words font-extrabold">여기에 문장이 로드됩니다.</p>
            
            <!-- 주관식 입력 필드 (객관식이 디폴트이므로 기본 숨김) --><input type="text" id="user-answer" placeholder="여기에 정답을 입력하세요" 
                   class="w-full p-3 border-2 border-sky-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 transition duration-150 ease-in-out hidden">

            <!-- 객관식 옵션 영역 --><div id="multiple-choice-area" class="mt-4 flex flex-col space-y-3">
                <!-- Radio buttons will be inserted here by JavaScript --></div>
        </div>

        <!-- 피드백 및 버튼 영역 --><div class="flex flex-col sm:flex-row justify-between items-center gap-4">
            <div id="feedback-message" class="text-lg font-medium w-full sm:w-2/3 min-h-[1.5rem]"></div>
            
            <button id="submit-btn" 
                    class="w-full sm:w-1/3 py-3 px-6 bg-sky-600 text-white font-semibold rounded-lg shadow-md hover:bg-sky-700 transition duration-300 ease-in-out">
                정답 확인
            </button>
            <button id="next-btn" 
                    class="w-full sm:w-1/3 py-3 px-6 bg-green-500 text-white font-semibold rounded-lg shadow-md hover:bg-green-600 transition duration-300 ease-in-out hidden" disabled>
                다음 문제
            </button>
            <!-- 퀴즈 진행 중에는 숨기고, 결과 화면에서 표시 --><button id="restart-btn" 
                    class="w-full sm:w-1/3 py-3 px-6 bg-gray-500 text-white font-semibold rounded-lg shadow-md hover:bg-gray-600 transition duration-300 ease-in-out hidden">
                다시 풀기
            </button>
        </div>

        <!-- 최종 점수 영역 --><div id="result-area" class="mt-8 p-6 bg-white border-2 border-sky-300 rounded-xl shadow-lg hidden">
            <p class="text-xl font-bold mb-2 text-sky-700 border-b pb-2">퀴즈 결과</p>
            <p id="final-score" class="text-4xl font-extrabold text-sky-800 my-4 text-center"></p>
            <!-- 틀린 문제 목록 표시 영역 --><div id="missed-questions-container"></div>
            <!-- 버튼 그룹 --><div class="flex flex-col sm:flex-row gap-4 mt-6">
                <button id="new-quiz-btn" class="w-full py-3 px-4 bg-sky-600 text-white font-semibold rounded-lg shadow-md hover:bg-sky-700 transition duration-300 ease-in-out hidden">
                    새 문제 풀기 (랜덤)
                </button>
                <!-- 인쇄 버튼 --><button id="print-btn" class="w-full py-3 px-4 bg-gray-600 text-white font-semibold rounded-lg shadow-md hover:bg-gray-700 transition duration-300 ease-in-out hidden">
                    결과 인쇄하기
                </button>
            </div>
            
        </div>
    </div>

    <script>
        // Quiz Data: 10 questions on English Sentence Components (S, V, O, C, A)
        const masterQuizData = [
            // 1. Subject (주어)
            {
                active: "", // 지침 텍스트 제거
                question: "[UW]My dog[/UW] barks loudly.",
                answer: "주어",
                explanation: "주어는 동작을 수행하거나 문장의 주제가 되는 성분입니다.",
                options: ["주어", "동사", "직접 목적어", "부사어"] // 4개로 조정
            },
            // 2. Verb (동사)
            {
                active: "", // 지침 텍스트 제거
                question: "We [UW]studied[/UW] for the final test.",
                answer: "동사",
                explanation: "동사는 주어의 동작이나 상태를 나타냅니다.",
                options: ["주어", "동사", "주격 보어", "부사어"] // 4개로 조정
            },
            // 3. Object (직접 목적어) - Direct Object
            {
                active: "", // 지침 텍스트 제거
                question: "She baked [UW]a huge cake[/UW] for the party.",
                answer: "직접 목적어", // 구체화
                explanation: "직접 목적어는 타동사 'baked'의 동작을 받는 대상입니다. (3형식)", // 구체화
                options: ["주어", "동사", "직접 목적어", "간접 목적어"] // 구체화
            },
            // 4. Complement (주격 보어) - Subject Complement (Adjective)
            {
                active: "", // 지침 텍스트 제거
                question: "The movie was very [UW]boring[/UW].",
                answer: "주격 보어", // 구체화
                explanation: "연결 동사('was') 뒤에서 주어('movie')의 상태를 설명하는 주격 보어입니다. (2형식)", // 구체화
                options: ["동사", "주격 보어", "목적격 보어", "부사어"] // 구체화
            },
            // 5. Adverbial (부사어) - Adverb
            {
                active: "", // 지침 텍스트 제거
                question: "He runs [UW]quickly[/UW] every morning.",
                answer: "부사어",
                explanation: "부사어는 동사('runs')를 수식하며 동작이 어떻게 수행되었는지 보여줍니다.",
                options: ["주어", "동사", "직접 목적어", "부사어"] // 4개로 조정
            },
            // 6. Complement (주격 보어) - Subject Complement (Noun)
            {
                active: "", // 지침 텍스트 제거
                question: "My mother is [UW]a fantastic teacher[/UW].",
                answer: "주격 보어", // 구체화
                explanation: "연결 동사('is') 뒤에서 주어('mother')를 다시 이름 짓거나 정의하는 주격 보어입니다. (2형식)", // 구체화
                options: ["주어", "간접 목적어", "주격 보어", "목적격 보어"] // 구체화
            },
            // 7. Object (간접 목적어) - Indirect Object
            {
                active: "", // 지침 텍스트 제거
                question: "I gave [UW]him[/UW] a new book.",
                answer: "간접 목적어", // 구체화
                explanation: "간접 목적어는 동작의 대상 중 '누구에게' 해당하는 부분입니다. (4형식)", // 구체화
                options: ["주어", "동사", "직접 목적어", "간접 목적어"] // 구체화
            },
            // 8. Adverbial (부사어) - Adverbial Phrase (Place)
            {
                active: "", // 지침 텍스트 제거
                question: "The students played soccer [UW]in the gym[/UW].",
                answer: "부사어",
                explanation: "부사어는 동사('played')를 수식하며 동작이 일어난 장소를 나타냅니다. (부사구)",
                options: ["주어", "동사", "간접 목적어", "부사어"] // 구체화
            },
            // 9. Verb (동사) - Phrasal Verb
            {
                active: "", // 지침 텍스트 제거
                question: "You must [UW]turn off[/UW] your phone during the movie.",
                answer: "동사",
                explanation: "구동사 'turn off'는 문장에서 주된 동사 성분 역할을 합니다.",
                options: ["주어", "동사", "직접 목적어", "부사어"] // 구체화
            },
            // 10. Complement (목적격 보어) - Object Complement
            {
                active: "", // 지침 텍스트 제거
                question: "We call him [UW]Boss[/UW] because he leads the team.",
                answer: "목적격 보어", // 구체화
                explanation: "목적격 보어는 목적어('him')를 설명하거나 다시 이름 짓습니다. (5형식)", // 구체화
                options: ["주어", "동사", "직접 목적어", "목적격 보어"] // 구체화
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswerChecked = false;
        let incorrectAnswers = []; 
        let currentQuizSet = []; 

        // Get DOM elements
        const progressText = document.getElementById('progress-text');
        const activeSentenceEl = document.getElementById('active-sentence');
        const questionTextEl = document.getElementById('question-text');
        const userAnswerEl = document.getElementById('user-answer');
        const feedbackMessageEl = document.getElementById('feedback-message');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const newQuizBtn = document.getElementById('new-quiz-btn'); 
        const resultArea = document.getElementById('result-area');
        const finalScoreEl = document.getElementById('final-score');
        const questionArea = document.getElementById('question-area');
        const multipleChoiceArea = document.getElementById('multiple-choice-area');
        const missedQuestionsContainer = document.getElementById('missed-questions-container'); 
        const printBtn = document.getElementById('print-btn'); 

        // Fisher-Yates shuffle algorithm
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Selects random questions (up to 10)
        function selectRandomQuestions(data, count) {
            const shuffled = shuffleArray([...data]);
            return shuffled.slice(0, count);
        }

        // Starts a new quiz or restarts the existing one
        function startNewQuiz(isNewSet = false) {
            currentQuestionIndex = 0;
            score = 0;
            isAnswerChecked = false;
            incorrectAnswers = []; 

            // Select a new set of questions only if explicitly requested or if no set exists
            if (isNewSet || currentQuizSet.length === 0) {
                 currentQuizSet = selectRandomQuestions(masterQuizData, 10);
            }

            // Reset UI elements
            if (questionArea) questionArea.classList.remove('hidden');
            if (feedbackMessageEl) feedbackMessageEl.classList.remove('hidden', 'text-red-600', 'text-green-600');
            if (feedbackMessageEl) feedbackMessageEl.textContent = '';
            
            if (restartBtn) restartBtn.classList.add('hidden');
            if (newQuizBtn) newQuizBtn.classList.add('hidden');
            if (printBtn) printBtn.classList.add('hidden'); 
            if (resultArea) resultArea.classList.add('hidden');
            if (progressText) progressText.classList.remove('hidden');

            loadQuestion();
        }

        // Loads the current question
        function loadQuestion() {
            if (currentQuestionIndex >= currentQuizSet.length) {
                showResults();
                return;
            }

            const currentQuestion = currentQuizSet[currentQuestionIndex];
            
            // Reset state
            if (feedbackMessageEl) feedbackMessageEl.textContent = '';
            if (submitBtn) submitBtn.classList.remove('hidden');
            if (nextBtn) nextBtn.classList.add('hidden');
            if (nextBtn) nextBtn.disabled = true;
            isAnswerChecked = false;
            
            // Update question content
            if (progressText) progressText.textContent = `문제 ${currentQuestionIndex + 1} / ${currentQuizSet.length}`;
            
            // active: "" 이므로 이 부분은 이제 빈 문자열을 표시합니다.
            if (activeSentenceEl) activeSentenceEl.textContent = currentQuestion.active;

            // Visualizing the underline using the [UW][/UW] marker
            if (questionTextEl) {
                const underlinedHtml = currentQuestion.question
                    .replace('[UW]', '<span class="question-text-line">') 
                    .replace('[/UW]', '</span>');
                questionTextEl.innerHTML = underlinedHtml;
            }
            
            // Render multiple choice options
            if (multipleChoiceArea) multipleChoiceArea.classList.remove('hidden');
            if (currentQuestion.options && Array.isArray(currentQuestion.options) && currentQuestion.options.length > 0) {
                renderMultipleChoice(currentQuestion.options);
            } else if (multipleChoiceArea) {
                console.error("Error: Options array is missing or empty for the current question.");
                multipleChoiceArea.innerHTML = '<p class="text-red-500">객관식 보기를 불러올 수 없습니다. (데이터 오류)</p>';
            }
        }

        // Renders multiple choice options
        function renderMultipleChoice(options) {
            if (!multipleChoiceArea) return;
            
            multipleChoiceArea.innerHTML = '';
            const shuffledOptions = shuffleArray([...options]);

            shuffledOptions.forEach((option, index) => {
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.id = `option-${index}`;
                radio.name = 'quiz-option';
                radio.value = option;
                radio.className = 'w-5 h-5 text-sky-600 focus:ring-sky-500 border-gray-300';

                const label = document.createElement('label');
                label.htmlFor = `option-${index}`;
                label.textContent = option;
                label.className = 'ml-3 text-lg text-gray-700 cursor-pointer w-full p-2 rounded-lg border border-gray-200 hover:bg-sky-100 transition duration-150 flex items-center';

                const div = document.createElement('div');
                div.className = 'flex items-center';
                div.appendChild(radio);
                div.appendChild(label);
                
                label.addEventListener('click', () => {
                    // Check radio button on label click for better mobile touch experience
                    radio.checked = true;
                });

                multipleChoiceArea.appendChild(div);
            });
        }

        // Checks the answer
        function checkAnswer() {
            if (isAnswerChecked) return;
            if (!submitBtn) return;

            const currentQuestionData = currentQuizSet[currentQuestionIndex];
            const selectedRadio = document.querySelector('input[name="quiz-option"]:checked');
            
            if (!selectedRadio) {
                if(feedbackMessageEl) {
                    feedbackMessageEl.className = 'text-lg font-medium w-full sm:w-2/3 text-red-600';
                    feedbackMessageEl.textContent = '답을 하나 선택해주세요.';
                }
                return;
            }
            
            const userAnswer = selectedRadio.value.trim();
            const correctAnswerFull = currentQuestionData.answer.trim();
            const explanation = currentQuestionData.explanation;

            // 정답과 선택지 모두 영문 표기를 제거했으므로, 이제 전체 한국어 명칭으로 비교합니다.
            let isCorrect = (userAnswer === correctAnswerFull);
            
            // 객관식 보기는 비활성화
            document.querySelectorAll('input[name="quiz-option"]').forEach(radio => radio.disabled = true);
            
            submitBtn.classList.add('hidden');
            if (nextBtn) {
                nextBtn.classList.remove('hidden');
                nextBtn.disabled = false;
            }
            isAnswerChecked = true; 
            
            if (isCorrect) {
                score++;
                if (feedbackMessageEl) {
                    feedbackMessageEl.className = 'text-lg font-medium w-full sm:w-2/3 text-green-600';
                    feedbackMessageEl.textContent = '✅ 정답입니다! 다음 문제로 넘어가세요.';
                }

                document.querySelectorAll('input[name="quiz-option"]').forEach(radio => {
                    const radioValue = radio.value.trim();
                    if (radioValue === correctAnswerFull) { // 전체 텍스트로 비교
                        radio.nextElementSibling.classList.add('bg-green-200', 'border-green-500');
                    }
                });
            } else {
                // 오답인 경우, 틀린 문제 배열에 추가
                incorrectAnswers.push(currentQuestionData);

                if (feedbackMessageEl) {
                    feedbackMessageEl.className = 'text-lg font-medium w-full sm:w-2/3 text-red-600';
                    feedbackMessageEl.innerHTML = `❌ 오답입니다. 정답: <span class="font-extrabold text-sky-600">'${correctAnswerFull}'</span><br><span class="text-sm text-gray-700">💡 해설: ${explanation}</span>`;
                }
                
                document.querySelectorAll('input[name="quiz-option"]').forEach(radio => {
                    const label = radio.nextElementSibling;
                    const radioValue = radio.value.trim();
                    
                    if (radio.checked) {
                        label.classList.add('bg-red-200', 'border-red-500'); 
                    } 
                    if (radioValue === correctAnswerFull) { // 전체 텍스트로 비교
                        label.classList.add('bg-sky-200', 'border-sky-500'); // 정답은 하늘색으로 표시
                    }
                });
            }
        }

        // Moves to the next question
        function moveToNext() {
            if (!isAnswerChecked) {
                if (feedbackMessageEl) feedbackMessageEl.textContent = '먼저 정답을 확인하세요.';
                return;
            }
            
            currentQuestionIndex++;
            loadQuestion();
        }

        // Displays results
        function showResults() {
            if (questionArea) questionArea.classList.add('hidden');
            if (submitBtn) submitBtn.classList.add('hidden');
            if (nextBtn) nextBtn.classList.add('hidden');
            if (feedbackMessageEl) feedbackMessageEl.classList.add('hidden');
            if (progressText) progressText.classList.add('hidden');
            
            // 결과 화면 관련 버튼 표시
            if (restartBtn) restartBtn.classList.remove('hidden');
            if (newQuizBtn) newQuizBtn.classList.remove('hidden'); 
            if (printBtn) printBtn.classList.remove('hidden'); 

            const total = currentQuizSet.length;
            if (finalScoreEl) finalScoreEl.textContent = `총 ${total}문제 중 ${score}점 획득하셨습니다! (${(score / total * 100).toFixed(0)}%)`;

            // 틀린 문제 목록 생성 및 표시
            if (missedQuestionsContainer) {
                missedQuestionsContainer.innerHTML = '';
                if (incorrectAnswers.length > 0) {
                    let listHtml = '<h3 class="text-xl font-bold text-gray-800 mt-8 mb-4 border-t pt-4 border-sky-200">틀린 문제 복습</h3>';
                    
                    incorrectAnswers.forEach((item, index) => {
                        // 밑줄을 시각화하고 정답 자리에는 정답 표시 (하늘색 600)
                        const questionTextDisplay = item.question
                            .replace('[UW]', `<span class="text-sky-600 font-extrabold underline">`)
                            .replace('[/UW]', '</span>');
                        
                        listHtml += `
                            <div class="p-4 mb-4 border border-gray-200 rounded-lg bg-gray-50">
                                <p class="font-bold text-lg mb-2 text-gray-800">문제 ${index + 1}. 문장: ${questionTextDisplay}</p>
                                <p class="text-green-700 font-semibold mt-2">✅ 정답: <span class="font-extrabold">${item.answer}</span></p>
                                <p class="text-sm text-gray-600 mt-2 border-t border-gray-300 pt-2">💡 해설: ${item.explanation}</p>
                            </div>
                        `;
                    });
                    missedQuestionsContainer.innerHTML = listHtml;
                } else {
                     missedQuestionsContainer.innerHTML = '<p class="text-lg text-green-700 mt-4 font-semibold text-center py-4">🎉 모든 문제를 맞추셨습니다! 대단해요!</p>';
                }
            }

            if (resultArea) resultArea.classList.remove('hidden');
        }

        // 퀴즈 재시작 함수 (동일 문제 세트로)
        function restartQuiz() {
            startNewQuiz(false);
        }
        
        // 새 문제 풀기 함수 (새로운 문제 세트로)
        function startNewSetQuiz() {
            startNewQuiz(true);
        }

        // 인쇄 기능
        if(printBtn) {
            printBtn.addEventListener('click', () => {
                window.print();
            });
        }

        // 이벤트 리스너 등록
        if(submitBtn) submitBtn.addEventListener('click', checkAnswer);
        if(nextBtn) nextBtn.addEventListener('click', moveToNext);
        if(restartBtn) restartBtn.addEventListener('click', restartQuiz); // '다시 풀기'
        if(newQuizBtn) newQuizBtn.addEventListener('click', startNewSetQuiz); // '새 문제 풀기 (랜덤)'
        
        // Enter 키 로직: '다음 문제' 버튼의 표시 여부와 현재 포커스에 따라 동작 분리
        document.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                
                // 3. 최종 결과 화면일 때 -> '다시 풀기'로 동작
                if (currentQuestionIndex >= currentQuizSet.length && (resultArea && resultArea.classList.contains('hidden') === false)) {
                     if (restartBtn) restartBtn.click(); // '다시 풀기' 버튼 클릭 동작
                     return;
                }
                
                // 1. '다음 문제' 버튼이 숨겨져 있다면 (아직 정답 확인 전) -> 정답 확인
                if (nextBtn && nextBtn.classList.contains('hidden')) {
                    // 객관식: 옵션 중 하나가 선택되었을 때
                    if (document.querySelector('input[name="quiz-option"]:checked')) {
                        checkAnswer();
                    }
                } 
                // 2. '다음 문제' 버튼이 보인다면 (정답 확인 후) -> 다음 문제로 이동
                else {
                    moveToNext();  
                }
            }
        });

        // 퀴즈 초기 로드 (새로운 문제 세트로 시작)
        window.onload = () => startNewQuiz(true);
    </script>
</body>
</html>
