<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다양한 시제의 수동태 퀴즈</title>
    <!-- Tailwind CSS CDN --><script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Inter 폰트 사용 설정 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* 밝은 회색 배경 */
        }
        .quiz-container {
            max-width: 640px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        /* Custom style for the underline effect using border-bottom */
        .question-text-line {
            display: inline-block;
            border-bottom: 2px solid #0284c7; /* Sky Blue color for underline */
            padding-bottom: 2px;
            line-height: 1.25;
            min-width: 150px; /* Minimum width for the blank */
            text-align: center;
        }

        /* 인쇄용 CSS 설정 */
        @media print {
            body {
                background-color: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .quiz-container {
                box-shadow: none !important;
                margin: 0 auto !important;
                padding: 0 !important;
                max-width: 100% !important;
            }
            /* 인쇄 시 숨길 요소 */
            #mode-toggle-btn, #progress-text, #question-area, #submit-btn, #next-btn, #feedback-message, #restart-btn, #new-quiz-btn, #print-btn, .flex.justify-between.items-center.gap-4 {
                display: none !important;
            }
            /* 결과 영역을 깨끗하게 표시 */
            #result-area {
                display: block !important;
                background-color: white !important;
                border: none !important;
                color: black !important;
                padding: 0 !important;
                margin-top: 0 !important;
            }
            #result-area p, #result-area h3 {
                color: black !important;
            }
            /* 틀린 문제 복습 부분의 배경색을 회색으로 (인쇄용) */
            #missed-questions-container .bg-gray-50 {
                background-color: #eeeeee !important;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
            #missed-questions-container .text-red-700, #missed-questions-container .text-green-700 {
                color: #333 !important;
            }
        }
    </style>
</head>
<body class="p-4">

    <div id="quiz-app" class="quiz-container">
        <h1 class="text-3xl font-extrabold text-center text-sky-700 mb-6 border-b pb-3">다양한 시제의 수동태 퀴즈 (10문제)</h1>

        <!-- 모드 선택 및 진행 상황 표시 --><div class="flex justify-end items-center mb-4">
            <span id="progress-text" class="text-lg font-semibold text-gray-600">문제 1 / 10</span>
        </div>

        <!-- 문제 영역 --><div id="question-area" class="bg-sky-50 p-6 rounded-lg mb-6">
            <p class="text-sm text-sky-600 mb-2">다음 문맥을 읽고, 밑줄에 들어갈 **올바른 수동태 동사 형태**를 영문으로 완성하세요. (be + p.p. 형태)</p>
            <p id="active-sentence" class="text-xl font-bold text-gray-800 mb-4 break-words">Context Sentence</p>
            
            <!-- 질문 텍스트: 밑줄(_______) 대신 HTML <span> 태그를 사용하여 밑줄 시각화 --><p id="question-text" class="text-lg text-gray-700 mb-4 break-words">The subject <span class="question-text-line" id="blank-underline"></span> ...</p>
            
            <!-- 주관식 입력 필드 (객관식이 디폴트이므로 기본 숨김) --><input type="text" id="user-answer" placeholder="여기에 수동태 동사 부분을 입력하세요 (예: was built, will be finished)" 
                   class="w-full p-3 border-2 border-sky-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 transition duration-150 ease-in-out hidden">

            <!-- 객관식 옵션 영역 --><div id="multiple-choice-area" class="mt-4 flex flex-col space-y-3">
                <!-- Radio buttons will be inserted here by JavaScript --></div>
        </div>

        <!-- 피드백 및 버튼 영역 --><div class="flex flex-col sm:flex-row justify-between items-center gap-4">
            <div id="feedback-message" class="text-lg font-medium w-full sm:w-2/3 min-h-[1.5rem]"></div>
            
            <button id="submit-btn" 
                    class="w-full sm:w-1/3 py-3 px-6 bg-sky-600 text-white font-semibold rounded-lg shadow-md hover:bg-sky-700 transition duration-300 ease-in-out">
                정답 확인
            </button>
            <button id="next-btn" 
                    class="w-full sm:w-1/3 py-3 px-6 bg-green-500 text-white font-semibold rounded-lg shadow-md hover:bg-green-600 transition duration-300 ease-in-out hidden" disabled>
                다음 문제
            </button>
            <!-- 퀴즈 진행 중에는 숨기고, 결과 화면에서 표시 --><button id="restart-btn" 
                    class="w-full sm:w-1/3 py-3 px-6 bg-gray-500 text-white font-semibold rounded-lg shadow-md hover:bg-gray-600 transition duration-300 ease-in-out hidden">
                다시 풀기
            </button>
        </div>

        <!-- 최종 점수 영역 (디자인 변경됨) --><div id="result-area" class="mt-8 p-6 bg-white border-2 border-sky-300 rounded-xl shadow-lg hidden">
            <p class="text-xl font-bold mb-2 text-sky-700 border-b pb-2">퀴즈 결과</p>
            <p id="final-score" class="text-4xl font-extrabold text-sky-800 my-4 text-center"></p>
            <!-- 틀린 문제 목록 표시 영역 --><div id="missed-questions-container"></div>
            <!-- 버튼 그룹 --><div class="flex flex-col sm:flex-row gap-4 mt-6">
                <button id="new-quiz-btn" class="w-full py-3 px-4 bg-sky-600 text-white font-semibold rounded-lg shadow-md hover:bg-sky-700 transition duration-300 ease-in-out hidden">
                    문제 더 풀기 (랜덤)
                </button>
                <!-- 인쇄 버튼 --><button id="print-btn" class="w-full py-3 px-4 bg-gray-600 text-white font-semibold rounded-lg shadow-md hover:bg-gray-700 transition duration-300 ease-in-out hidden">
                    결과 인쇄하기
                </button>
            </div>
            
        </div>
    </div>

    <script>
        // 문제 데이터: 총 20개 문제 풀 (다양한 시제의 수동태)
        const masterQuizData = [
            // 1. 현재시제 (단순)
            {
                active: "전 세계 사람들이 BTS의 노래를 좋아한다.",
                question: "BTS's songs (_______) by people all over the world. (like)",
                answer: "are liked",
                explanation: "주어(Songs)가 복수이고 현재의 사실이므로 'be동사 현재형 + p.p.'인 'are liked'가 됩니다.",
                options: ["is liked", "are liked", "was liked", "will be liked"]
            },
            // 2. 과거시제 (단순)
            {
                active: "우리 반 친구들이 어제 이 과목 숙제를 끝냈다.",
                question: "This subject's homework (_______) by our classmates yesterday. (finish)",
                answer: "was finished",
                explanation: "과거 시점(어제)의 단수 주어(Homework)이므로 'was finished'가 됩니다.",
                options: ["is finished", "was finished", "has been finished", "will be finished"]
            },
            // 3. 미래시제
            {
                active: "그녀는 내일 이 중요한 발표를 할 것이다.",
                question: "This important presentation (_______) by her tomorrow. (do)",
                answer: "will be done",
                explanation: "미래 시제 수동태는 'will be + p.p.' 형태를 사용합니다.",
                options: ["is done", "will be done", "will do", "will be doing"]
            },
            // 4. 현재 진행형
            {
                active: "선생님이 지금 수행평가 점수를 계산하고 계신다.",
                question: "The evaluation score (_______) by the teacher now. (calculate)",
                answer: "is being calculated",
                explanation: "현재 진행형의 수동태는 'be동사 + being + p.p.' 형태를 사용합니다.",
                options: ["is calculated", "is being calculated", "was being calculated", "has been calculated"]
            },
            // 5. 과거 진행형
            {
                active: "그때 나는 친구들과 함께 그 인기 게임을 하고 있었다.",
                question: "That popular game (_______) by my friends at that time. (play)",
                answer: "was being played",
                explanation: "과거 진행형의 수동태는 'was/were + being + p.p.' 형태를 사용합니다.",
                options: ["was played", "is being played", "was being played", "had been played"]
            },
            // 6. 현재완료
            {
                active: "누군가 내 카카오톡 프로필 사진을 바꿔놓았다.",
                question: "My KakaoTalk profile photo (_______). (change)",
                answer: "has been changed",
                explanation: "과거의 행위가 현재까지 영향을 미치므로 현재완료 수동태('has been + p.p.')를 사용합니다.",
                options: ["was changed", "has been changed", "had been changed", "is changed"]
            },
            // 7. 조동사 (must)
            {
                active: "우리는 늦지 않기 위해 지금 바로 출발해야 한다.",
                question: "The departure (_______) right now to avoid being late. (must make)",
                answer: "must be made",
                explanation: "조동사 수동태는 '조동사 + be + p.p.' 형태를 사용합니다. (make의 p.p.는 made)",
                options: ["must left", "must be made", "is left", "must being left"]
            },
            // 8. 현재시제 의문문 - 수정된 문제
            {
                active: "너는 요즘 인스타에서 친구들에게 팔로우를 많이 당하니?",
                question: "(_______) by many friends these days? (you/follow)",
                answer: "Are you followed",
                explanation: "주어(you)가 복수 취급되며, 현재의 습관/일반적인 사실을 묻는 수동태 의문문이므로 'Are you followed'가 됩니다.",
                options: ["Do you follow", "Are you followed", "Have you followed", "Were you followed"]
            },
            // 9. 현재시제 의문문 (원래 9번 자리는 현재 8번 문제로 대체됨)
            {
                active: "사람들은 매일 아침 급식 메뉴를 확인하니?",
                question: "(_______) every morning? (The lunch menu/check)",
                answer: "Is the lunch menu checked",
                explanation: "현재시제 수동태 의문문은 'Be동사 + 주어 + p.p.' 형태를 사용합니다. (주어: The lunch menu, 단수)",
                options: ["Does the lunch menu check", "Is the lunch menu checked", "Are the lunch menus checked", "Has the lunch menu been checked"]
            },
            // 10. 수여동사 (4형식 - 간접목적어 주어)
            {
                active: "누군가 내게 새 휴대폰 케이스를 선물했다.",
                question: "I (_______) a new phone case by someone. (give)",
                answer: "was given",
                explanation: "간접 목적어(I)가 주어가 되면 'be동사 과거형 + p.p.' 형태가 됩니다. (was given)",
                options: ["am given", "was giving", "was given", "will be given"]
            },
            // 11. 과거시제 (단순) - 수정된 문제
            {
                active: "우리 반 친구들이 어제 현진이의 생일 이벤트를 성공적으로 열었다.",
                question: "Hyunjin's birthday event (_______) successfully by our classmates yesterday. (hold)",
                answer: "was held",
                explanation: "과거 시점(어제)의 단수 주어(Event) 수동태이므로 'was held'가 됩니다. (hold의 p.p.는 held)",
                options: ["is held", "was held", "has been held", "will be held"]
            },
            // 12. 과거시제 (복수 주어) - 수정된 문제
            {
                active: "민지는 어제 친구들에게 줄 예쁜 휴대폰 케이스 몇 개를 만들었다.",
                question: "Several pretty phone cases (_______) by Minji yesterday. (make)",
                answer: "were made",
                explanation: "과거 시점(어제)의 복수 주어(Cases) 수동태이므로 'was'가 아닌 'were made'가 됩니다. (make의 p.p.는 made)",
                options: ["was made", "were made", "are made", "have been made"]
            },
            // 13. 미래 진행형 - 수정된 문제
            {
                active: "내일 오후 3시에 친구와 찍을 인생네컷 사진이 준비되고 있을 것이다.",
                question: "The photobooth pictures (_______) for the story at 3 PM tomorrow. (take)",
                answer: "will be being taken",
                explanation: "미래 진행형의 수동태는 'will be being + p.p.' 형태를 사용하며, 미래 특정 시점에 진행 중인 수동적 동작을 나타냅니다.",
                options: ["will be taken", "are being taken", "will be being taken", "have been taken"]
            },
            // 14. 현재완료 진행형 (수정된 문제)
            {
                active: "내가 아침 식사로 토스트를 먹기 시작한 이후로, 내 식사 장면이 친구들에게 라이브 방송되고 있었다.",
                question: "My breakfast (_______) by my friends since 7 AM. (stream)",
                answer: "has been being streamed",
                explanation: "주어(My breakfast)는 단수이며, 과거부터 현재까지 계속 진행되는 수동적 동작이므로 현재완료 진행 수동태('has been being streamed')를 사용합니다.",
                options: ["has streamed", "is being streamed", "has been being streamed", "has been streamed"]
            },
            // 15. 조동사 완료 - 수정된 문제
            {
                active: "친구가 시험 범위 필기를 복사하기 위해 내 공책을 잠시 빌릴 수 있을 것이다.",
                question: "My notebook (_______) by my friend for the test notes. (can borrow)",
                answer: "can be borrowed",
                explanation: "조동사 수동태는 '조동사 + be + p.p.' 형태를 사용합니다.",
                options: ["can borrowed", "is borrowed", "can be borrowed", "will be borrowed"]
            },
            // 16. 수동태 관용구 (5형식 간결화)
            {
                active: "사람들은 그를 우리 반의 영웅이라고 부른다.",
                question: "He (_______) the hero of our class by people. (call)",
                answer: "is called",
                explanation: "5형식 'call A B'의 수동태 형태는 'A is called B'입니다.",
                options: ["is calling", "is called", "calls", "was called"]
            },
            // 17. 동사구 수동태
            {
                active: "우리는 그 선생님의 강의를 주의 깊게 들었다.",
                question: "The teacher's lecture (_______) carefully by us. (listen to)",
                answer: "was listened to",
                explanation: "동사구 'listen to'는 수동태가 되어도 전치사 'to'가 반드시 남아있어야 합니다. 과거 시제이므로 'was listened to'입니다.",
                options: ["was listened", "was listened to", "is listened to", "listened to"]
            },
            // 18. 조동사 (can't)
            {
                active: "우리는 교실에서 이 문제를 풀 수 없다.",
                question: "This problem (_______) in the classroom. (can't solve)",
                answer: "cannot be solved",
                explanation: "조동사 부정문 수동태는 '조동사 + not + be + p.p.' 형태를 사용합니다. (cannot be solved)",
                options: ["can't solved", "cannot be solved", "can't solving", "can be solved"]
            },
            // 19. 수여동사 (4형식 - 직접목적어 주어)
            {
                active: "누군가 내게 새 휴대폰 케이스를 선물했다.",
                question: "A new phone case (_______) me by someone. (give)",
                answer: "was given to",
                explanation: "직접 목적어(Case)가 주어가 되면 간접 목적어(me) 앞에 전치사(to)가 필요합니다. 'was given to'가 됩니다.",
                options: ["was given me", "was given to", "is given to", "will be given"]
            },
            // 20. 과거 진행형 (부정문) - 수정된 문제
            {
                active: "그때 우리는 교실에서 동생 생일 선물을 포장하고 있는 중이 아니었다.",
                question: "My little brother's birthday gift (_______) by us in the classroom at that moment. (not wrap)",
                answer: "was not being wrapped",
                explanation: "과거 진행형 수동태 부정문은 'was/were not + being + p.p.' 형태를 사용합니다.",
                options: ["wasn't done", "was not being wrapped", "was not wrapping", "had not been wrapped"]
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswerChecked = false;
        let quizMode = 'objective'; 
        let incorrectAnswers = []; 
        let currentQuizSet = []; 

        // DOM 요소들 가져오기
        const progressText = document.getElementById('progress-text');
        const activeSentenceEl = document.getElementById('active-sentence');
        const questionTextEl = document.getElementById('question-text');
        const userAnswerEl = document.getElementById('user-answer');
        const feedbackMessageEl = document.getElementById('feedback-message');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const newQuizBtn = document.getElementById('new-quiz-btn'); 
        const resultArea = document.getElementById('result-area');
        const finalScoreEl = document.getElementById('final-score');
        const questionArea = document.getElementById('question-area');
        // const modeToggleBtn = document.getElementById('mode-toggle-btn'); // 제거됨
        const multipleChoiceArea = document.getElementById('multiple-choice-area');
        const blankUnderlineEl = document.getElementById('blank-underline');
        const missedQuestionsContainer = document.getElementById('missed-questions-container'); 
        const printBtn = document.getElementById('print-btn'); 

        // 배열 섞기 함수 (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 마스터 데이터에서 무작위로 문제를 선택하는 함수
        function selectRandomQuestions(data, count) {
            const shuffled = shuffleArray([...data]);
            return shuffled.slice(0, count);
        }

        // 새로운 퀴즈 시작 또는 기존 퀴즈 다시 시작
        function startNewQuiz(isNewSet = false) {
            currentQuestionIndex = 0;
            score = 0;
            isAnswerChecked = false;
            incorrectAnswers = []; 
            quizMode = 'objective'; 

            // '문제 더 풀기'인 경우에만 문제 세트를 새로 선택
            if (isNewSet || currentQuizSet.length === 0) {
                 currentQuizSet = selectRandomQuestions(masterQuizData, 10);
            }

            // UI 요소 재설정
            if (questionArea) questionArea.classList.remove('hidden');
            if (feedbackMessageEl) feedbackMessageEl.classList.remove('hidden', 'text-red-600', 'text-green-600');
            if (feedbackMessageEl) feedbackMessageEl.textContent = '';
            
            // modeToggleBtn 제거됨
            if (restartBtn) restartBtn.classList.add('hidden');
            if (newQuizBtn) newQuizBtn.classList.add('hidden');
            if (printBtn) printBtn.classList.add('hidden'); 
            if (resultArea) resultArea.classList.add('hidden');
            
            loadQuestion();
        }

        // 퀴즈 시작 및 다음 문제 로드
        function loadQuestion() {
            if (currentQuestionIndex >= currentQuizSet.length) {
                showResults();
                return;
            }

            const currentQuestion = currentQuizSet[currentQuestionIndex];
            
            // 상태 초기화
            if (feedbackMessageEl) feedbackMessageEl.textContent = '';
            if (submitBtn) submitBtn.classList.remove('hidden');
            if (nextBtn) nextBtn.classList.add('hidden');
            if (nextBtn) nextBtn.disabled = true;
            isAnswerChecked = false;
            
            // 문제 내용 업데이트
            if (progressText) progressText.textContent = `문제 ${currentQuestionIndex + 1} / ${currentQuizSet.length}`;
            if (activeSentenceEl) activeSentenceEl.textContent = currentQuestion.active;

            // 밑줄 시각화 처리
            if (questionTextEl) {
                const [prefix, suffix] = currentQuestion.question.split('(_______)');
                questionTextEl.innerHTML = `${prefix}<span class="question-text-line" id="blank-underline"></span>${suffix}`;
            }
            
            // 객관식만 렌더링
            if (multipleChoiceArea) multipleChoiceArea.classList.remove('hidden');
            if (currentQuestion.options && Array.isArray(currentQuestion.options) && currentQuestion.options.length > 0) {
                renderMultipleChoice(currentQuestion.options);
            } else if (multipleChoiceArea) {
                console.error("Error: Options array is missing or empty for the current question.");
                multipleChoiceArea.innerHTML = '<p class="text-red-500">객관식 보기를 불러올 수 없습니다. (데이터 오류)</p>';
            }
        }

        // 객관식 옵션 렌더링
        function renderMultipleChoice(options) {
            if (!multipleChoiceArea) return;
            
            multipleChoiceArea.innerHTML = '';
            const shuffledOptions = shuffleArray([...options]);

            shuffledOptions.forEach((option, index) => {
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.id = `option-${index}`;
                radio.name = 'quiz-option';
                radio.value = option;
                radio.className = 'w-5 h-5 text-sky-600 focus:ring-sky-500 border-gray-300';

                const label = document.createElement('label');
                label.htmlFor = `option-${index}`;
                label.textContent = option;
                label.className = 'ml-3 text-lg text-gray-700 cursor-pointer w-full p-2 rounded-lg border border-gray-200 hover:bg-sky-100 transition duration-150 flex items-center';

                const div = document.createElement('div');
                div.className = 'flex items-center';
                div.appendChild(radio);
                div.appendChild(label);
                
                label.addEventListener('click', () => {
                    // 라디오 버튼을 클릭해도 체크되도록 처리 (모바일 터치 편의성)
                    radio.checked = true;
                });

                multipleChoiceArea.appendChild(div);
            });
        }

        // 정답 확인 함수
        function checkAnswer() {
            if (isAnswerChecked) return;
            if (!submitBtn) return;

            const currentQuestionData = currentQuizSet[currentQuestionIndex];
            const selectedRadio = document.querySelector('input[name="quiz-option"]:checked');
            
            if (!selectedRadio) {
                if(feedbackMessageEl) {
                    feedbackMessageEl.className = 'text-lg font-medium w-full sm:w-2/3 text-red-600';
                    feedbackMessageEl.textContent = '답을 하나 선택해주세요.';
                }
                return;
            }
            
            const userAnswer = selectedRadio.value.trim();
            const correctAnswer = currentQuestionData.answer.trim();
            const explanation = currentQuestionData.explanation;
            
            // 정규화 (소문자, 공백 제거)
            const normalizedCorrectAnswer = correctAnswer.toLowerCase().replace(/\s/g, '');
            const normalizedUserAnswer = userAnswer.toLowerCase().replace(/\s/g, '');

            // 객관식 보기는 비활성화
            document.querySelectorAll('input[name="quiz-option"]').forEach(radio => radio.disabled = true);
            
            submitBtn.classList.add('hidden');
            if (nextBtn) {
                nextBtn.classList.remove('hidden');
                nextBtn.disabled = false;
            }
            isAnswerChecked = true; 

            // 축약형/비축약형 모두 허용 로직 (객관식 모드에서는 이미 보기 옵션에 의해 처리됨)
            let isCorrect = (normalizedUserAnswer === normalizedCorrectAnswer);
            
            if (isCorrect) {
                score++;
                if (feedbackMessageEl) {
                    feedbackMessageEl.className = 'text-lg font-medium w-full sm:w-2/3 text-green-600';
                    feedbackMessageEl.textContent = '✅ 정답입니다! 다음 문제로 넘어가세요.';
                }

                document.querySelectorAll('input[name="quiz-option"]').forEach(radio => {
                    const radioValue = radio.value.trim().toLowerCase().replace(/\s/g, '');
                    if (radioValue === normalizedCorrectAnswer) {
                        radio.nextElementSibling.classList.add('bg-green-200', 'border-green-500');
                    }
                });
            } else {
                // 오답인 경우, 틀린 문제 배열에 추가
                incorrectAnswers.push(currentQuestionData);

                if (feedbackMessageEl) {
                    feedbackMessageEl.className = 'text-lg font-medium w-full sm:w-2/3 text-red-600';
                    feedbackMessageEl.innerHTML = `❌ 오답입니다. 정답: <span class="font-extrabold text-blue-600">'${correctAnswer}'</span><br><span class="text-sm text-gray-700">💡 해설: ${explanation}</span>`;
                }
                
                document.querySelectorAll('input[name="quiz-option"]').forEach(radio => {
                    const label = radio.nextElementSibling;
                    const radioValue = radio.value.trim().toLowerCase().replace(/\s/g, '');
                    
                    if (radio.checked) {
                        label.classList.add('bg-red-200', 'border-red-500'); 
                    } 
                    if (radioValue === normalizedCorrectAnswer) {
                        label.classList.add('bg-sky-200', 'border-sky-500'); // 정답은 하늘색으로 표시
                    }
                });
            }
        }

        // 다음 문제로 이동
        function moveToNext() {
            if (!isAnswerChecked) {
                if (feedbackMessageEl) feedbackMessageEl.textContent = '먼저 정답을 확인하세요.';
                return;
            }
            
            currentQuestionIndex++;
            loadQuestion();
        }

        // 결과 표시 함수
        function showResults() {
            if (questionArea) questionArea.classList.add('hidden');
            if (submitBtn) submitBtn.classList.add('hidden');
            if (nextBtn) nextBtn.classList.add('hidden');
            if (feedbackMessageEl) feedbackMessageEl.classList.add('hidden');
            if (progressText) progressText.classList.add('hidden');
            
            // 결과 화면 관련 버튼 표시
            if (restartBtn) restartBtn.classList.remove('hidden');
            if (newQuizBtn) newQuizBtn.classList.remove('hidden'); 
            if (printBtn) printBtn.classList.remove('hidden'); 

            const total = currentQuizSet.length;
            if (finalScoreEl) finalScoreEl.textContent = `총 ${total}문제 중 ${score}점 획득하셨습니다! (${(score / total * 100).toFixed(0)}%)`;

            // 틀린 문제 목록 생성 및 표시
            if (missedQuestionsContainer) {
                missedQuestionsContainer.innerHTML = '';
                if (incorrectAnswers.length > 0) {
                    let listHtml = '<h3 class="text-xl font-bold text-gray-800 mt-8 mb-4 border-t pt-4 border-sky-200">틀린 문제 복습</h3>';
                    
                    incorrectAnswers.forEach((item, index) => {
                        // 밑줄을 시각화하고 정답 자리에는 정답 표시 (하늘색 600)
                        const questionTextDisplay = item.question.replace('(_______)', `<span class="text-sky-600 font-extrabold underline">${item.answer}</span>`);
                        
                        listHtml += `
                            <div class="p-4 mb-4 border border-gray-200 rounded-lg bg-gray-50">
                                <p class="font-bold text-base mb-1 text-gray-800">문제 ${index + 1}. (원문): ${item.active}</p>
                                <p class="mb-2 text-gray-600">질문: ${questionTextDisplay}</p>
                                <p class="text-green-700 font-semibold mt-2">✅ 정답: <span class="font-extrabold">${item.answer}</span></p>
                                <p class="text-sm text-gray-600 mt-2 border-t border-gray-300 pt-2">💡 해설: ${item.explanation}</p>
                            </div>
                        `;
                    });
                    missedQuestionsContainer.innerHTML = listHtml;
                } else {
                     missedQuestionsContainer.innerHTML = '<p class="text-lg text-green-700 mt-4 font-semibold text-center py-4">🎉 모든 문제를 맞추셨습니다! 대단해요!</p>';
                }
            }

            if (resultArea) resultArea.classList.remove('hidden');
        }

        // 퀴즈 재시작 함수 (동일 문제 세트로)
        function restartQuiz() {
            startNewQuiz(false);
        }
        
        // 신규 문제 풀기 함수 (새로운 문제 세트로)
        function startNewSetQuiz() {
            startNewQuiz(true);
        }

        // 인쇄 기능
        if(printBtn) {
            printBtn.addEventListener('click', () => {
                window.print();
            });
        }

        // 이벤트 리스너 등록
        if(submitBtn) submitBtn.addEventListener('click', checkAnswer);
        if(nextBtn) nextBtn.addEventListener('click', moveToNext);
        if(restartBtn) restartBtn.addEventListener('click', restartQuiz); // '다시 풀기'
        if(newQuizBtn) newQuizBtn.addEventListener('click', startNewSetQuiz); // '문제 더 풀기 (랜덤)'
        
        // Enter 키 로직: '다음 문제' 버튼의 표시 여부와 현재 포커스에 따라 동작 분리
        document.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                
                // 3. 최종 결과 화면일 때 -> '다시 풀기'로 동작
                if (currentQuestionIndex >= currentQuizSet.length && (resultArea && resultArea.classList.contains('hidden') === false)) {
                     if (restartBtn) restartBtn.click(); // '다시 풀기' 버튼 클릭 동작
                     return;
                }
                
                // 1. '다음 문제' 버튼이 숨겨져 있다면 (아직 정답 확인 전) -> 정답 확인
                if (nextBtn && nextBtn.classList.contains('hidden')) {
                    // 객관식: 옵션 중 하나가 선택되었을 때
                    if (document.querySelector('input[name="quiz-option"]:checked')) {
                        checkAnswer();
                    }
                } 
                // 2. '다음 문제' 버튼이 보인다면 (정답 확인 후) -> 다음 문제로 이동
                else {
                    moveToNext();  
                }
            }
        });

        // 퀴즈 초기 로드 (새로운 문제 세트로 시작)
        window.onload = () => startNewQuiz(true);
    </script>
</body>
</html>
