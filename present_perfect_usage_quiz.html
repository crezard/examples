<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현재완료 (4가지 용법) 퀴즈</title>
    <!-- Tailwind CSS CDN --><script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Inter 폰트 사용 설정 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* 밝은 회색 배경 */
        }
        .quiz-container {
            max-width: 640px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        /* Custom style for the underline effect using border-bottom */
        .question-text-line {
            display: inline-block;
            border-bottom: 2px solid #0284c7; /* Sky Blue color for underline */
            padding-bottom: 2px;
            line-height: 1.25;
            min-width: 150px; /* Minimum width for the blank */
            text-align: center;
        }

        /* 인쇄용 CSS 설정 */
        @media print {
            body {
                background-color: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .quiz-container {
                box-shadow: none !important;
                margin: 0 auto !important;
                padding: 0 !important;
                max-width: 100% !important;
            }
            /* 인쇄 시 숨길 요소 */
            #mode-toggle-btn, #progress-text, #question-area, #submit-btn, #next-btn, #feedback-message, #restart-btn, #new-quiz-btn, #print-btn, .flex.justify-between.items-center.gap-4 {
                display: none !important;
            }
            /* 결과 영역을 깨끗하게 표시 */
            #result-area {
                display: block !important;
                background-color: white !important;
                border: none !important;
                color: black !important;
                padding: 0 !important;
                margin-top: 0 !important;
            }
            #result-area p, #result-area h3 {
                color: black !important;
            }
            /* 틀린 문제 복습 부분의 배경색을 회색으로 (인쇄용) */
            #missed-questions-container .bg-gray-50 {
                background-color: #eeeeee !important;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
            #missed-questions-container .text-red-700, #missed-questions-container .text-green-700 {
                color: #333 !important;
            }
        }
    </style>
</head>
<body class="p-4">

    <div id="quiz-app" class="quiz-container">
        <h1 class="text-3xl font-extrabold text-center text-sky-700 mb-6 border-b pb-3">현재완료 (4가지 용법) 퀴즈 (10문제)</h1>

        <!-- 모드 선택 및 진행 상황 표시 --><div class="flex justify-between items-center mb-4">
             <button id="mode-toggle-btn" class="py-2 px-4 text-sm bg-gray-200 text-gray-800 font-semibold rounded-lg hover:bg-gray-300 transition duration-150">
                현재: 객관식 (변경: 주관식으로 보기)
            </button>
            <span id="progress-text" class="text-lg font-semibold text-gray-600">문제 1 / 10</span>
        </div>

        <!-- 문제 영역 --><div id="question-area" class="bg-sky-50 p-6 rounded-lg mb-6">
            <p class="text-sm text-sky-600 mb-2">다음 문맥을 읽고, 밑줄에 들어갈 **올바른 현재완료 동사 형태**를 영문으로 완성하세요. (4가지 용법 중 하나)</p>
            <p id="active-sentence" class="text-xl font-bold text-gray-800 mb-4 break-words">Context Sentence</p>
            
            <!-- 질문 텍스트: 밑줄(_______) 대신 HTML <span> 태그를 사용하여 밑줄 시각화 --><p id="question-text" class="text-lg text-gray-700 mb-4 break-words">Question: The problem statement will load here (_______) ...</p>
            
            <!-- 주관식 입력 필드 (객관식이 디폴트이므로 기본 숨김) --><input type="text" id="user-answer" placeholder="여기에 정답을 입력하세요 (예: have seen, hasn't finished)" 
                   class="w-full p-3 border-2 border-sky-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 transition duration-150 ease-in-out hidden">

            <!-- 객관식 옵션 영역 --><div id="multiple-choice-area" class="mt-4 flex flex-col space-y-3">
                <!-- Radio buttons will be inserted here by JavaScript --></div>
        </div>

        <!-- 피드백 및 버튼 영역 --><div class="flex flex-col sm:flex-row justify-between items-center gap-4">
            <div id="feedback-message" class="text-lg font-medium w-full sm:w-2/3 min-h-[1.5rem]"></div>
            
            <button id="submit-btn" 
                    class="w-full sm:w-1/3 py-3 px-6 bg-sky-600 text-white font-semibold rounded-lg shadow-md hover:bg-sky-700 transition duration-300 ease-in-out">
                정답 확인
            </button>
            <button id="next-btn" 
                    class="w-full sm:w-1/3 py-3 px-6 bg-green-500 text-white font-semibold rounded-lg shadow-md hover:bg-green-600 transition duration-300 ease-in-out hidden" disabled>
                다음 문제
            </button>
            <!-- 퀴즈 진행 중에는 숨기고, 결과 화면에서 표시 --><button id="restart-btn" 
                    class="w-full sm:w-1/3 py-3 px-6 bg-gray-500 text-white font-semibold rounded-lg shadow-md hover:bg-gray-600 transition duration-300 ease-in-out hidden">
                다시 풀기
            </button>
        </div>

        <!-- 최종 점수 영역 (디자인 변경됨) --><div id="result-area" class="mt-8 p-6 bg-white border-2 border-sky-300 rounded-xl shadow-lg hidden">
            <p class="text-xl font-bold mb-2 text-sky-700 border-b pb-2">퀴즈 결과</p>
            <p id="final-score" class="text-4xl font-extrabold text-sky-800 my-4 text-center"></p>
            <!-- 틀린 문제 목록 표시 영역 --><div id="missed-questions-container"></div>
            <!-- 버튼 그룹 --><div class="flex flex-col sm:flex-row gap-4 mt-6">
                <button id="new-quiz-btn" class="w-full py-3 px-4 bg-sky-600 text-white font-semibold rounded-lg shadow-md hover:bg-sky-700 transition duration-300 ease-in-out hidden">
                    문제 더 풀기 (랜덤)
                </button>
                <!-- 인쇄 버튼 --><button id="print-btn" class="w-full py-3 px-4 bg-gray-600 text-white font-semibold rounded-lg shadow-md hover:bg-gray-700 transition duration-300 ease-in-out hidden">
                    결과 인쇄하기
                </button>
            </div>
            
        </div>
    </div>

    <script>
        // 문제 데이터: 총 20개 문제 풀 (현재완료 4가지 용법)
        const masterQuizData = [
            // 1. 경험 (Ever/Never, Before, Times)
            {
                active: "I traveled to France three times in my life. (용법: 경험)",
                question: "I (_______) to France three times. (be)",
                answer: "have been",
                explanation: "'three times'는 현재까지의 경험을 나타내므로 현재완료 경험 용법(have been)을 사용합니다.",
                options: ["have been", "was", "went", "had been"]
            },
            // 2. 완료 (Just, Already, Yet)
            {
                active: "The teacher finished correcting the homework just now. (용법: 완료)",
                question: "The teacher (_______) the homework already. (correct)",
                answer: "has already corrected",
                explanation: "'already'는 이미 끝냈다는 완료를 나타내며, 동사 사이에 위치합니다.",
                options: ["corrected", "has already corrected", "already corrects", "had already corrected"]
            },
            // 3. 결과 (Lost, Gone)
            {
                active: "He went to New York last week, and he is still there. (용법: 결과)",
                question: "He (_______) to New York. (go)",
                answer: "has gone",
                explanation: "'has gone to'는 '가버리고 지금 여기에 없다'는 결과를 나타냅니다.",
                options: ["went", "has gone", "has been", "is going"]
            },
            // 4. 계속 (Since/For)
            {
                active: "We started living here in 2010, and we still live here. (용법: 계속)",
                question: "We (_______) here since 2010. (live)",
                answer: "have lived",
                explanation: "'since 2010'은 과거부터 현재까지 계속되는 동작이나 상태를 나타내는 계속 용법입니다.",
                options: ["lived", "have lived", "were living", "are living"]
            },
            // 5. 경험 (Negative Ever/Never)
            {
                active: "I have never seen snow in my life. (용법: 경험)",
                question: "I (_______) snow. (never see)",
                answer: "have never seen",
                explanation: "'never'는 현재까지의 경험 부재를 나타내는 경험 용법입니다.",
                options: ["never saw", "have never seen", "didn't see", "had never seen"]
            },
            // 6. 완료 (Yet - Negative)
            {
                active: "The rain did not stop, and it is still raining. (용법: 완료)",
                question: "The rain (_______) yet. (not stop)",
                answer: "has not stopped",
                explanation: "'yet'은 아직 완료되지 않았음을 나타내며, 주로 부정문이나 의문문에 쓰입니다.",
                options: ["didn't stop", "has not stopped", "had not stopped", "won't stop"]
            },
            // 7. 결과 (Bought)
            {
                active: "My father bought a new car, and he has it now. (용법: 결과)",
                question: "My father (_______) a new car. (buy)",
                answer: "has bought",
                explanation: "과거에 구매한 행위의 결과로 현재 차를 소유하고 있다는 의미이므로 결과 용법입니다.",
                options: ["bought", "has bought", "had bought", "buys"]
            },
            // 8. 계속 (How long)
            {
                active: "They have been married for twenty years. (용법: 계속)",
                question: "How long (_______) married? (they/be)",
                answer: "have they been",
                explanation: "'How long'은 기간을 물을 때 쓰는 계속 용법의 의문문입니다.",
                options: ["did they be", "have they been", "are they", "had they been"]
            },
            // 9. 경험 (Before)
            {
                active: "Have you ever tried paragliding? (용법: 경험)",
                question: "Have you ever (_______) paragliding before? (try)",
                answer: "tried",
                explanation: "'ever'와 'before'는 현재까지의 경험을 묻는 경험 용법의 핵심 부사입니다.",
                options: ["tried", "try", "trying", "to try"]
            },
            // 10. 완료 (Just)
            {
                active: "The movie just ended. Let's go home. (용법: 완료)",
                question: "The movie (_______) just. (end)",
                answer: "has just ended",
                explanation: "'just'는 방금 끝났다는 완료를 나타내며, 현재완료와 함께 사용됩니다.",
                options: ["just ended", "has just ended", "just ends", "had just ended"]
            },
            // --- 추가 10문제 ---
            // 11. 결과 (Break)
            {
                active: "I broke my leg, and it is still broken now. (용법: 결과)",
                question: "I (_______) my leg. (break)",
                answer: "have broken",
                explanation: "과거의 행위(부러뜨린 것)의 결과(다리가 부러진 상태)가 현재까지 지속됨을 나타내는 결과 용법입니다.",
                options: ["broke", "have broken", "had broken", "break"]
            },
            // 12. 계속 (For + Duration)
            {
                active: "She studied English for ten hours straight. (용법: 계속)",
                question: "She (_______) for ten hours. (study)",
                answer: "has studied",
                explanation: "'for ten hours'는 기간을 나타내며, 현재까지 계속되었음을 의미하는 계속 용법입니다.",
                options: ["studied", "has studied", "was studying", "studies"]
            },
            // 13. 경험 (Once/Twice)
            {
                active: "They saw that famous musical once when it was touring. (용법: 경험)",
                question: "They (_______) that musical once. (see)",
                answer: "have seen",
                explanation: "'once'는 현재까지의 횟수/경험을 나타내므로 경험 용법입니다.",
                options: ["saw", "have seen", "had seen", "are seeing"]
            },
            // 14. 완료 (Not yet)
            {
                active: "We haven't received the mail. We are still waiting. (용법: 완료)",
                question: "We (_______) the mail yet. (not receive)",
                answer: "have not received",
                explanation: "'yet'과 함께 아직 완료되지 않았음을 나타내는 완료 용법의 부정형입니다.",
                options: ["didn't receive", "had not received", "have not received", "are not receiving"]
            },
            // 15. 결과 (Go - Negative)
            {
                active: "She did not go to the party, and she is at home now. (용법: 결과)",
                question: "She (_______) to the party. (not go)",
                answer: "has not gone",
                explanation: "'has not gone'은 '가지 않았고 지금도 없다'는 결과를 나타냅니다.",
                options: ["didn't go", "has not gone", "had not gone", "doesn't go"]
            },
            // 16. 경험 (Times, Ongoing possibility)
            {
                active: "This is the third time he failed the exam. (용법: 경험)",
                question: "He (_______) the exam three times. (fail)",
                answer: "has failed",
                explanation: "'three times'는 현재까지의 횟수/경험을 나타내는 경험 용법입니다.",
                options: ["failed", "has failed", "had failed", "is failing"]
            },
            // 17. 계속 (Live in)
            {
                active: "She lived in Paris all her life, and she is still there. (용법: 계속)",
                question: "She (_______) in Paris all her life. (live)",
                answer: "has lived",
                explanation: "'all her life'는 과거부터 현재까지 계속되는 기간을 나타내므로 계속 용법입니다.",
                options: ["lived", "has lived", "was living", "lives"]
            },
            // 18. 완료 (Recently)
            {
                active: "I saw her recently, so I know she is well. (용법: 완료)",
                question: "I (_______) her recently. (see)",
                answer: "have seen",
                explanation: "'recently'는 최근에 완료된 경험이나 동작을 나타내는 완료 용법입니다.",
                options: ["saw", "have seen", "had seen", "see"]
            },
            // 19. 결과 (Gone to/Been to distinction)
            {
                active: "We went to Italy and came back. (용법: 경험)",
                question: "We (_______) to Italy. (be)",
                answer: "have been",
                explanation: "'have been to'는 '어디에 다녀온 적이 있다'는 경험 용법입니다. ('have gone to'는 '가버리고 지금 없다'는 결과 용법)",
                options: ["went", "have gone", "had been", "have been"]
            },
            // 20. 경험 (Ever - Question)
            {
                active: "Did you watch that movie before? (용법: 경험)",
                question: "(_______) that movie before? (you/watch)",
                answer: "Have you watched",
                explanation: "'before'는 현재까지의 경험을 묻는 경험 용법의 의문문입니다.",
                options: ["Did you watch", "Have you watched", "Had you watched", "Do you watch"]
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswerChecked = false;
        let quizMode = 'objective'; 
        let incorrectAnswers = []; 
        let currentQuizSet = []; 

        // DOM 요소들 가져오기
        const progressText = document.getElementById('progress-text');
        const activeSentenceEl = document.getElementById('active-sentence');
        const questionTextEl = document.getElementById('question-text');
        const userAnswerEl = document.getElementById('user-answer');
        const feedbackMessageEl = document.getElementById('feedback-message');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const newQuizBtn = document.getElementById('new-quiz-btn'); 
        const resultArea = document.getElementById('result-area');
        const finalScoreEl = document.getElementById('final-score');
        const questionArea = document.getElementById('question-area');
        const modeToggleBtn = document.getElementById('mode-toggle-btn');
        const multipleChoiceArea = document.getElementById('multiple-choice-area');
        const blankUnderlineEl = document.getElementById('blank-underline');
        const missedQuestionsContainer = document.getElementById('missed-questions-container'); 
        const printBtn = document.getElementById('print-btn'); 

        // 배열 섞기 함수 (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 마스터 데이터에서 무작위로 문제를 선택하는 함수
        function selectRandomQuestions(data, count) {
            const shuffled = shuffleArray([...data]);
            return shuffled.slice(0, count);
        }

        // 퀴즈 모드 전환 함수
        function toggleQuizMode() {
            if (isAnswerChecked) return; 

            if (quizMode === 'subjective') {
                quizMode = 'objective';
                modeToggleBtn.textContent = '현재: 객관식 (변경: 주관식으로 보기)';
                userAnswerEl.classList.add('hidden');
                multipleChoiceArea.classList.remove('hidden');
                userAnswerEl.value = ''; 
            } else {
                quizMode = 'subjective';
                modeToggleBtn.textContent = '현재: 주관식 (변경: 객관식으로 보기)';
                userAnswerEl.classList.remove('hidden');
                multipleChoiceArea.classList.add('hidden');
                multipleChoiceArea.innerHTML = ''; 
            }
            submitBtn.textContent = '정답 확인';
            loadQuestion(true); 
            userAnswerEl.focus();
        }

        // 새로운 퀴즈 시작 또는 기존 퀴즈 다시 시작
        function startNewQuiz(isNewSet = false) {
            currentQuestionIndex = 0;
            score = 0;
            isAnswerChecked = false;
            incorrectAnswers = []; 

            // '문제 더 풀기'인 경우에만 문제 세트를 새로 선택
            if (isNewSet || currentQuizSet.length === 0) {
                 currentQuizSet = selectRandomQuestions(masterQuizData, 10);
            }

            // UI 요소 재설정
            questionArea.classList.remove('hidden');
            feedbackMessageEl.classList.remove('hidden', 'text-red-600', 'text-green-600');
            feedbackMessageEl.textContent = '';
            progressText.classList.remove('hidden');
            modeToggleBtn.classList.remove('hidden');
            restartBtn.classList.add('hidden');
            newQuizBtn.classList.add('hidden');
            printBtn.classList.add('hidden'); 
            resultArea.classList.add('hidden');
            
            loadQuestion();
        }

        // 퀴즈 시작 및 다음 문제 로드
        function loadQuestion(isModeChange = false) {
            if (currentQuestionIndex >= currentQuizSet.length) {
                showResults();
                return;
            }

            const currentQuestion = currentQuizSet[currentQuestionIndex];
            
            // 상태 초기화
            userAnswerEl.value = '';
            feedbackMessageEl.textContent = '';
            userAnswerEl.disabled = false;
            submitBtn.classList.remove('hidden');
            nextBtn.classList.add('hidden');
            nextBtn.disabled = true;
            isAnswerChecked = false;
            
            // 문제 내용 업데이트
            progressText.textContent = `문제 ${currentQuestionIndex + 1} / ${currentQuizSet.length}`;
            activeSentenceEl.textContent = currentQuestion.active;

            // 밑줄 시각화 처리
            const [prefix, suffix] = currentQuestion.question.split('(_______)');
            questionTextEl.innerHTML = `${prefix}<span class="question-text-line" id="blank-underline"></span>${suffix}`;
            
            // 모드에 따른 입력 UI 설정
            if (quizMode === 'subjective') {
                userAnswerEl.classList.remove('hidden');
                multipleChoiceArea.classList.add('hidden');
                userAnswerEl.focus();
            } else {
                // 옵션이 유효한 배열인지 확인하고 렌더링 시도
                userAnswerEl.classList.add('hidden');
                multipleChoiceArea.classList.remove('hidden');
                if (currentQuestion.options && Array.isArray(currentQuestion.options) && currentQuestion.options.length > 0) {
                    renderMultipleChoice(currentQuestion.options);
                } else {
                    console.error("Error: Options array is missing or empty for the current question.");
                    multipleChoiceArea.innerHTML = '<p class="text-red-500">객관식 보기를 불러올 수 없습니다. (데이터 오류)</p>';
                }
            }

            if (!isModeChange) {
                userAnswerEl.focus();
            }
        }

        // 객관식 옵션 렌더링
        function renderMultipleChoice(options) {
            multipleChoiceArea.innerHTML = '';
            const shuffledOptions = shuffleArray([...options]);

            shuffledOptions.forEach((option, index) => {
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.id = `option-${index}`;
                radio.name = 'quiz-option';
                radio.value = option;
                radio.className = 'w-5 h-5 text-sky-600 focus:ring-sky-500 border-gray-300';

                const label = document.createElement('label');
                label.htmlFor = `option-${index}`;
                label.textContent = option;
                label.className = 'ml-3 text-lg text-gray-700 cursor-pointer w-full p-2 rounded-lg border border-gray-200 hover:bg-sky-100 transition duration-150 flex items-center';

                const div = document.createElement('div');
                div.className = 'flex items-center';
                div.appendChild(radio);
                div.appendChild(label);
                
                label.addEventListener('click', () => {
                    radio.checked = true;
                });

                multipleChoiceArea.appendChild(div);
            });
        }

        // 정답 확인 함수
        function checkAnswer() {
            if (isAnswerChecked) return;

            const currentQuestionData = currentQuizSet[currentQuestionIndex];
            let userAnswer = userAnswerEl.value.trim();
            const correctAnswer = currentQuestionData.answer.trim();
            let isCorrect = false;

            // 정답 및 사용자 입력 정규화 (소문자, 공백 제거)
            const normalizedCorrectAnswer = correctAnswer.toLowerCase().replace(/\s/g, '');
            const normalizedUserAnswer = userAnswer.toLowerCase().replace(/\s/g, '');

            // 1. 객관식 모드 처리
            if (quizMode === 'objective') {
                const selectedRadio = document.querySelector('input[name="quiz-option"]:checked');
                if (!selectedRadio) {
                    feedbackMessageEl.className = 'text-lg font-medium w-full sm:w-2/3 text-red-600';
                    feedbackMessageEl.textContent = '답을 하나 선택해주세요.';
                    return;
                }
                // 객관식은 보기 값이 정규화되어 있으므로 직접 비교
                isCorrect = (selectedRadio.value.trim().toLowerCase().replace(/\s/g, '') === normalizedCorrectAnswer);
                
                document.querySelectorAll('input[name="quiz-option"]').forEach(radio => radio.disabled = true);
            } 
            // 2. 주관식 모드 처리 (축약형 허용 로직 포함)
            else {
                if (userAnswer === '') {
                    feedbackMessageEl.className = 'text-lg font-medium w-full sm:w-2/3 text-red-600';
                    feedbackMessageEl.textContent = '답을 입력해 주세요.';
                    return;
                }
                
                // 1차 비교: 공식 정답과 비교
                isCorrect = (normalizedUserAnswer === normalizedCorrectAnswer);

                // 2차 비교: 부정형인 경우 축약형도 허용 (예: did not -> didn't)
                if (!isCorrect && normalizedCorrectAnswer.includes('not')) {
                    
                    // 정답의 축약형 생성 (간단한 형태만 지원)
                    let contractedCorrectAnswer = '';
                    if (normalizedCorrectAnswer.startsWith('did not')) {
                        contractedCorrectAnswer = normalizedCorrectAnswer.replace('did not', "didn't");
                    } else if (normalizedCorrectAnswer.startsWith('had not')) {
                        contractedCorrectAnswer = normalizedCorrectAnswer.replace('had not', "hadn't");
                    } else if (normalizedCorrectAnswer.startsWith('have not')) {
                        contractedCorrectAnswer = normalizedCorrectAnswer.replace('have not', "haven't");
                    } else if (normalizedCorrectAnswer.startsWith('has not')) {
                        contractedCorrectAnswer = normalizedCorrectAnswer.replace('has not', "hasn't");
                    }
                    
                    if (normalizedUserAnswer === contractedCorrectAnswer.replace(/\s/g, '')) {
                        isCorrect = true;
                    }
                }

                // 3차 비교: 긍정형의 경우 'be' 동사 축약형 허용 (have/has been -> 've/ 's been)
                if (!isCorrect && normalizedCorrectAnswer.includes('been')) {
                    let contractedCorrectAnswer = '';
                    if (normalizedCorrectAnswer.startsWith('have been')) {
                        // have been -> 've been
                        contractedCorrectAnswer = normalizedCorrectAnswer.replace('have', "'ve");
                    } else if (normalizedCorrectAnswer.startsWith('has been')) {
                        // has been -> 's been
                        contractedCorrectAnswer = normalizedCorrectAnswer.replace('has', "'s");
                    }

                    if (normalizedUserAnswer === contractedCorrectAnswer.replace(/\s/g, '')) {
                        isCorrect = true;
                    }
                }


                userAnswerEl.disabled = true;
            }

            const explanation = currentQuestionData.explanation;
            
            submitBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            nextBtn.disabled = false;
            isAnswerChecked = true; 

            if (isCorrect) {
                score++;
                feedbackMessageEl.className = 'text-lg font-medium w-full sm:w-2/3 text-green-600';
                feedbackMessageEl.textContent = '✅ 정답입니다! 다음 문제로 넘어가세요.';

                if (quizMode === 'subjective') {
                    userAnswerEl.classList.remove('border-red-500');
                    userAnswerEl.classList.add('border-green-500');
                } else {
                    document.querySelectorAll('input[name="quiz-option"]').forEach(radio => {
                        const radioValue = radio.value.trim().toLowerCase().replace(/\s/g, '');
                        if (radioValue === normalizedCorrectAnswer) {
                            radio.nextElementSibling.classList.add('bg-green-200', 'border-green-500');
                        }
                    });
                }
            } else {
                // 오답인 경우, 틀린 문제 배열에 추가
                incorrectAnswers.push(currentQuestionData);

                feedbackMessageEl.className = 'text-lg font-medium w-full sm:w-2/3 text-red-600';
                feedbackMessageEl.innerHTML = `❌ 오답입니다. 정답: <span class="font-extrabold text-blue-600">'${correctAnswer}'</span><br><span class="text-sm text-gray-700">💡 해설: ${explanation}</span>`;
                
                if (quizMode === 'subjective') {
                    userAnswerEl.classList.remove('border-green-500');
                    userAnswerEl.classList.add('border-red-500');
                } else {
                    document.querySelectorAll('input[name="quiz-option"]').forEach(radio => {
                        const label = radio.nextElementSibling;
                        const radioValue = radio.value.trim().toLowerCase().replace(/\s/g, '');
                        
                        if (radio.checked) {
                            label.classList.add('bg-red-200', 'border-red-500'); 
                        } 
                        if (radioValue === normalizedCorrectAnswer) {
                            label.classList.add('bg-sky-200', 'border-sky-500'); // 정답은 하늘색으로 표시
                        }
                    });
                }
            }
        }

        // 다음 문제로 이동
        function moveToNext() {
            if (!isAnswerChecked) {
                feedbackMessageEl.textContent = '먼저 정답을 확인하세요.';
                return;
            }
            
            userAnswerEl.classList.remove('border-green-500', 'border-red-500');
            userAnswerEl.classList.add('border-sky-300');

            currentQuestionIndex++;
            loadQuestion();
        }

        // 결과 표시 함수
        function showResults() {
            questionArea.classList.add('hidden');
            submitBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            feedbackMessageEl.classList.add('hidden');
            progressText.classList.add('hidden');
            modeToggleBtn.classList.add('hidden');
            
            // 결과 화면 관련 버튼 표시
            restartBtn.classList.remove('hidden');
            newQuizBtn.classList.remove('hidden'); 
            printBtn.classList.remove('hidden'); 

            const total = currentQuizSet.length;
            finalScoreEl.textContent = `총 ${total}문제 중 ${score}점 획득하셨습니다! (${(score / total * 100).toFixed(0)}%)`;

            // 틀린 문제 목록 생성 및 표시
            missedQuestionsContainer.innerHTML = '';
            if (incorrectAnswers.length > 0) {
                let listHtml = '<h3 class="text-xl font-bold text-gray-800 mt-8 mb-4 border-t pt-4 border-sky-200">틀린 문제 복습</h3>';
                
                incorrectAnswers.forEach((item, index) => {
                    // 밑줄을 시각화하고 정답 자리에는 정답 표시 (하늘색 600)
                    const questionTextDisplay = item.question.replace('(_______)', `<span class="text-sky-600 font-extrabold underline">${item.answer}</span>`);
                    
                    listHtml += `
                        <div class="p-4 mb-4 border border-gray-200 rounded-lg bg-gray-50">
                            <p class="font-bold text-base mb-1 text-gray-800">문제 ${index + 1}. (원문): ${item.active}</p>
                            <p class="mb-2 text-gray-600">질문: ${questionTextDisplay}</p>
                            <p class="text-green-700 font-semibold mt-2">✅ 정답: <span class="font-extrabold">${item.answer}</span></p>
                            <p class="text-sm text-gray-600 mt-2 border-t border-gray-300 pt-2">💡 해설: ${item.explanation}</p>
                        </div>
                    `;
                });
                missedQuestionsContainer.innerHTML = listHtml;
            } else {
                 missedQuestionsContainer.innerHTML = '<p class="text-lg text-green-700 mt-4 font-semibold text-center py-4">🎉 모든 문제를 맞추셨습니다! 대단해요!</p>';
            }

            resultArea.classList.remove('hidden');
        }

        // 퀴즈 재시작 함수 (동일 문제 세트로)
        function restartQuiz() {
            startNewQuiz(false);
        }
        
        // 신규 문제 풀기 함수 (새로운 문제 세트로)
        function startNewSetQuiz() {
            startNewQuiz(true);
        }

        // 인쇄 기능
        printBtn.addEventListener('click', () => {
            window.print();
        });

        // 이벤트 리스너 등록
        submitBtn.addEventListener('click', checkAnswer);
        nextBtn.addEventListener('click', moveToNext);
        restartBtn.addEventListener('click', restartQuiz); // '다시 풀기'
        newQuizBtn.addEventListener('click', startNewSetQuiz); // '문제 더 풀기 (랜덤)'
        modeToggleBtn.addEventListener('click', toggleQuizMode);
        
        // Enter 키 로직: '다음 문제' 버튼의 표시 여부와 현재 포커스에 따라 동작 분리
        document.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                
                // 3. 최종 결과 화면일 때 -> '다시 풀기'로 동작
                if (currentQuestionIndex >= currentQuizSet.length && resultArea.classList.contains('hidden') === false) {
                     restartBtn.click(); // '다시 풀기' 버튼 클릭 동작
                     return;
                }
                
                // 1. '다음 문제' 버튼이 숨겨져 있다면 (아직 정답 확인 전) -> 정답 확인
                if (nextBtn.classList.contains('hidden')) {
                    // 주관식: 입력 필드에 포커스가 있고 내용이 있을 때
                    if (quizMode === 'subjective' && document.activeElement === userAnswerEl && userAnswerEl.value.trim() !== '') {
                        checkAnswer();
                    } 
                    // 객관식: 옵션 중 하나가 선택되었을 때
                    else if (quizMode === 'objective' && document.querySelector('input[name="quiz-option"]:checked')) {
                        checkAnswer();
                    }
                } 
                // 2. '다음 문제' 버튼이 보인다면 (정답 확인 후) -> 다음 문제로 이동
                else {
                    moveToNext();  
                }
            }
        });

        // 퀴즈 초기 로드 (새로운 문제 세트로 시작)
        window.onload = () => startNewQuiz(true);
    </script>
</body>
